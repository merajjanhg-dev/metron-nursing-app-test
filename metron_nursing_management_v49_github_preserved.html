<!doctype html>
<!-- v49: based on GitHub index-13-fixed; existing GitHub features preserved; only requested integrations added -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08161a">
<title>سامانه مدیریت مترون بیمارستان — نسخه ۱۰</title>
<style>
:root{
 --bg:#071114;--panel:#0d1c20;--panel2:#11262b;--line:#29434a;
 --text:#eef8f7;--muted:#91a7aa;--pri:#36c7c1;--ok:#55d58f;
 --bad:#ff6b6b;--warn:#efc56c;--shadow:0 12px 32px #0005
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
header{position:sticky;top:0;z-index:50;background:#09181cdd;backdrop-filter:blur(10px);border-bottom:1px solid #214047}
.head{max-width:1500px;margin:auto;padding:13px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px}.sub{color:var(--muted);font-size:10px;margin-top:4px}.grow{flex:1}
main{max-width:1500px;margin:auto;padding:12px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.btn{appearance:none;border:1px solid #345159;background:#12262c;color:#e4f8f6;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer;min-height:40px}
.btn:active{transform:translateY(1px)}.btn.pri{background:#146c70;border-color:#49d6cf}.btn.ok{background:#155f40;border-color:#55d58f}
.btn.bad{background:#63252c;border-color:#ff6b6b}.btn.warn{background:#5b4619;border-color:#efc56c}
.btn.active{background:#146c70;border-color:#49d6cf}
.btn.small{padding:7px 9px;min-height:34px;font-size:10px}
.card{background:linear-gradient(145deg,#102024,#0b181c);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:10px}
.title{font-size:16px;font-weight:900;margin-bottom:10px}
.notice{padding:11px;border-radius:11px;background:#102a2f;border:1px solid #31545b;font-size:11px;line-height:1.9;margin:8px 0}
.notice.warn{background:#302719;border-color:#735b2a}.notice.bad{background:#321d22;border-color:#71353b}.notice.ok{background:#102a20;border-color:#356e50}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
label{display:block;font-size:11px;font-weight:800;margin:6px 0}
input,select,textarea{width:100%;background:#09171b;color:var(--text);border:1px solid #2b464d;border-radius:9px;padding:9px;font-size:12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tabs{display:flex;gap:7px;overflow-x:auto;overflow-y:visible;padding:3px 1px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.tabs .btn{flex:0 0 auto}
.tablewrap{overflow:auto;border:1px solid #263e44;border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:10.5px;min-width:640px}
th,td{border:1px solid #263e44;padding:7px;text-align:center;vertical-align:middle}
th{background:#14292e;color:#d8efed;font-weight:900}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17373b}
.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}
.progress{height:8px;background:#17272b;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pri)}
.wardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.wardcard{cursor:pointer;transition:.12s}.wardcard:hover{transform:translateY(-1px);border-color:#46737a}
.wardhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.module-btn{min-height:58px;text-align:right}
.module-btn b{display:block;font-size:11px}.module-btn span{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.stat{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.stat b{font-size:20px;display:block}.stat span{font-size:9px;color:var(--muted)}
.shiftcell{padding:5px;border-radius:8px;margin:2px 0;background:#173034}
.shiftcell.m{background:#3b2d1a}.shiftcell.e{background:#3b231d}.shiftcell.n{background:#242840}
.person-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.person{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.modalbg{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:#0e1d21;border:1px solid #3b5b63;border-radius:16px;width:min(920px,100%);max-height:92vh;overflow:auto;padding:15px}
.modal h2{font-size:15px;margin:0 0 10px}.close{float:left}
footer{text-align:center;color:#657c80;padding:24px;font-size:10px}
hr{border:0;border-top:1px solid #263e44;margin:13px 0}
@media(max-width:700px){
 .head{padding:10px}.brand{font-size:15px}.sub{font-size:9px}
 main{padding:8px}.card{padding:11px}.grid{grid-template-columns:1fr 1fr}
 .module-grid{grid-template-columns:1fr 1fr}.module-btn{min-height:64px}
 .wardgrid{grid-template-columns:1fr}.btn{min-height:42px}
}
</style>
<style id="supervisor-integration-v14">
.supervisor-modal{position:fixed;inset:0;z-index:99999;background:#071114;display:flex;flex-direction:column;}
.supervisor-top{height:54px;min-height:54px;background:#0b1b20;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;box-sizing:border-box;border-bottom:1px solid rgba(255,255,255,.12)}
.supervisor-title{font-weight:900;font-size:14px;margin-inline-start:auto;}
.supervisor-frame{width:100%;height:calc(100vh - 54px);border:0;background:#f3f5f7;display:block;}
@media(max-width:600px){.supervisor-top{height:50px;min-height:50px}.supervisor-frame{height:calc(100vh - 50px)}.supervisor-title{font-size:12px}.supervisor-top .btn{font-size:11px;padding:7px 9px}}
</style>
<style id="proposal-css">
.proposal-section{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)}
.proposal-section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.proposal-body{line-height:1.9;font-size:12px;margin-bottom:8px}
</style>
</head>

let supervisorWardId=null,supervisorFrame=null,supervisorStateKey=null;
function supervisorSourceForWard(wid){
 const safe=String(wid).replace(/[^a-zA-Z0-9_-]/g,'_');
 const stateKey='metron-supervisor-state-'+safe;
 return SUPERVISOR_SOURCE.replace(/__METRON_STATE_KEY__/g,stateKey).replace(/__METRON_HISTORY_KEY__/g,stateKey+'-history');
}
function mergeSupervisorStateForWard(w){
 const base=clone(w?.scheduleState||{});
 base.nurses=Array.isArray(base.nurses)?base.nurses:[];
 const byKey=new Map();
 (w?.nurses||[]).forEach(n=>{
   const key=n.globalPersonnelId?('g:'+String(n.globalPersonnelId).trim()):('n:'+proposalNormalizeName(n.name||''));
   if(key)byKey.set(key,n);
 });
 const used=new Set();
 base.nurses=base.nurses.map(sn=>{
   const key=sn.globalPersonnelId?('g:'+String(sn.globalPersonnelId).trim()):('n:'+proposalNormalizeName(sn.name||''));
   const mn=key?byKey.get(key):null;
   if(mn){used.add(mn.id);const merged=Object.assign(clone(sn),clone(mn),{id:sn.id});['preferences','softPreferences','monthlyConstraints','nurseRequestNote','globalPersonnelId','requestKey','requestProposals'].forEach(k=>{if(mn[k]!==undefined)merged[k]=clone(mn[k]);});return merged;}
   return sn;
 });
 (w?.nurses||[]).forEach(n=>{if(used.has(n.id))return; const key=n.globalPersonnelId?('g:'+String(n.globalPersonnelId).trim()):('n:'+proposalNormalizeName(n.name||'')); if(!base.nurses.some(sn=>{const sk=sn.globalPersonnelId?('g:'+String(sn.globalPersonnelId).trim()):('n:'+proposalNormalizeName(sn.name||''));return sk===key;}))base.nurses.push(clone(n));});
 base.nurses.forEach(n=>{if(n.active===undefined)n.active=true;});
 return base;
}

function openSupervisor(wid){
 const w=db.wards.find(x=>x.id===wid); if(!w)return;
 supervisorWardId=wid;
 const html=supervisorSourceForWard(wid);
 const m=html.match(/const STORAGE_KEY = '([^']+)'/); supervisorStateKey=m?m[1]:null;
 const f=document.createElement('iframe');
 f.id='supervisorFrame'; f.className='supervisor-frame'; f.title='نرم‌افزار سرپرستار';
 const root=document.createElement('div'); root.className='supervisor-modal'; root.id='supervisorModal';
 root.innerHTML='<div class="supervisor-top"><button type="button" class="btn bad" id="closeSupervisor">🚪 خروج از نقش سرپرستار</button><button type="button" class="btn pri" id="openRequestProposals">📥 درخواست و محدودیت پیشنهادی</button><div class="supervisor-title">نرم‌افزار سرپرستار — '+esc(w.name)+'</div></div>';
 root.appendChild(f); document.body.appendChild(root); supervisorFrame=f;
 document.getElementById('closeSupervisor').onclick=closeSupervisor; document.getElementById('openRequestProposals').onclick=()=>openRequestProposalPanel(wid);
 const init=()=>{
   try{
     const mergedState=mergeSupervisorStateForWard(w);
     w.scheduleState=mergedState;
     const state=JSON.stringify(mergedState);
     f.contentWindow.localStorage.setItem(supervisorStateKey,state);
     f.contentWindow.postMessage({bridge:'__METRON_SUPERVISOR_BRIDGE__',type:'INIT',state:mergedState},'*');
   }catch(e){console.error('Supervisor init failed',e)}
 };
 f.addEventListener('load',init,{once:false});
 // srcdoc is reliable on Android and keeps the original supervisor app intact.
 f.srcdoc=html;
}


function proposalNormalizeName(x){return String(x||'').trim().replace(/\s+/g,' ').replace(/[يى]/g,'ی').replace(/ك/g,'ک');}
function proposalKeys(data){return Object.keys(data||{}).filter(k=>/^\d+-([1-9]|1[0-2])$/.test(k)).sort((a,b)=>{const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return ay-by||am-bm;});}
function proposalMonthLabel(k){const [y,m]=k.split('-').map(Number);return (MONTHS[m-1]||m)+' '+fa(y);}
function proposalLatestKey(props){
 const keys=proposalKeys(props);
 return keys.sort((a,b)=>{
   const ta=Date.parse(props[a]?.submittedAt||props[a]?.importedAt||'')||0;
   const tb=Date.parse(props[b]?.submittedAt||props[b]?.importedAt||'')||0;
   return tb-ta || (Number(b.split('-')[0])-Number(a.split('-')[0])) || (Number(b.split('-')[1])-Number(a.split('-')[1]));
 })[0]||'';
}
function ensureProposalStore(n){n.requestProposals=n.requestProposals&&typeof n.requestProposals==='object'?n.requestProposals:{};return n.requestProposals;}
async function openRequestProposalPanel(wid){
 const old=document.getElementById('requestProposalPanel');if(old)old.remove();
 // همیشه آخرین اطلاعات را از Supabase می‌گیریم تا درخواست تازه پرستار بدون فایل برای سرپرستار ظاهر شود.
 try{
   const cloudData=await loadDBFromCloud();
   if(cloudData&&Array.isArray(cloudData.wards)){
     db=cloudData;
     try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
   }
 }catch(e){console.warn('Cloud refresh for nurse requests failed:',e);}
 const w=db.wards.find(x=>String(x.id)===String(wid)); if(!w)return;
 const root=document.createElement('div');root.id='requestProposalPanel';root.className='supervisor-modal';
 root.style.zIndex='99999';
 document.body.appendChild(root);
 renderRequestProposalPanel(wid);
}
function proposalValueText(v,w){
 if(v===null||v===undefined||v==='')return '—';
 if(Array.isArray(v))return v.length?v.map(x=>proposalValueText(x,w)).join('، '):'—';
 if(typeof v==='object')return Object.entries(v).filter(([k,x])=>x!==undefined&&x!==null&&x!==''&&(typeof x!=='object'||Object.keys(x).length)).map(([k,x])=>`${k}: ${proposalValueText(x,w)}`).join(' | ')||'—';
 return String(v);
}
function renderRequestProposalPanel(wid){
 const root=document.getElementById('requestProposalPanel');const w=db.wards.find(x=>String(x.id)===String(wid));if(!root||!w)return;
 const nurses=w.nurses||[];let selectedNurse=ui.proposalNurseId||'';
 if(selectedNurse&&!nurses.some(n=>String(n.id)===String(selectedNurse)))selectedNurse='';
 if(!selectedNurse){const withP=nurses.find(n=>Object.keys(n.requestProposals||{}).length);selectedNurse=withP?String(withP.id):String(nurses[0]?.id||'');ui.proposalNurseId=selectedNurse;}
 const n=nurses.find(x=>String(x.id)===String(selectedNurse));const props=ensureProposalStore(n||{});const keys=proposalKeys(props);const latest=proposalLatestKey(props);let k=ui.proposalMonthKey&&props[ui.proposalMonthKey]?ui.proposalMonthKey:(latest||`${Number((db.hospital?.year||'1405').toString().match(/\d+/)?.[0]||1405)}-1`);ui.proposalMonthKey=k;
 const pr=props[k];

 const sectionKeys=Object.keys(sectionNames);

   for(const k of LEGACY_KEYS){

function workHoursFor(type,holiday,s){
 s=s||DEF;
 if(type==='morning')return holiday?num(s.holidayUpliftHours):num(s.morningHours);
 if(type==='evening')return holiday?num(s.holidayUpliftHours):num(s.eveningHours);
 if(type==='night')return holiday?num(s.nightHolidayHours):num(s.nightHours);
 return 0;
}
function isHoliday(md,y,m,d){
 if(md.holidays&&md.holidays.includes(d))return true;
 // روز جمعه از برنامه اصلی نیز تعطیل محسوب می‌شود؛ تقویم هفته با محاسبه میلادی/ژولیَن ساده نگه داشته می‌شود.
 return jalaliWeekday(y,m,d)==='جمعه';
}
function _divJ(a,b){return Math.trunc(a/b);}
function _jalCalJ(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];const bl=breaks.length,gy=jy+621;let leapJ=-14,jp=breaks[0],jm=0,jump=0,i=1;if(jy<jp||jy>=breaks[bl-1])throw new Error('سال جلالی خارج از محدوده پشتیبانی‌شده: '+jy);for(;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=_divJ(jump,33)*8+_divJ(jump%33,4);jp=jm;}let n=jy-jp;leapJ+=_divJ(n,33)*8+_divJ((n%33)+3,4);if((jump%33)===4&&jump-n===4)leapJ++;const leapG=_divJ(gy,4)-_divJ((_divJ(gy,100)+1)*3,4)-150;const march=20+leapJ-leapG;if(jump-n<6)n=n-jump+_divJ(jump+4,33)*33;let leap=(((n+1)%33)-1)%4;if(leap===-1)leap=4;return {leap,gy,march};}
function _g2dJ(gy,gm,gd){return Math.floor(Date.UTC(gy,gm-1,gd)/86400000)+2440588;}
function _j2dJ(jy,jm,jd){const r=_jalCalJ(jy);return _g2dJ(r.gy,3,r.march)+(jm-1)*31-_divJ(jm,7)*(jm-7)+jd-1;}
function jalaliWeekday(jy,jm,jd){const jdn=_j2dJ(jy,jm,jd);const d=new Date((jdn-2440588)*86400000);return ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][d.getUTCDay()];}
function countShift(w,nid,k){
 const md=w.scheduleState?.months?.[k];if(!md)return {morning:0,evening:0,night:0,holiday:0,head:0};
 const [y,m]=k.split('-').map(Number),len=monthLen(y,m),c={morning:0,evening:0,night:0,holiday:0,head:0};
 for(let d=1;d<=len;d++){
   const hol=isHoliday(md,y,m,d),s=md.schedule[d]||{};
   SHIFTS.forEach(t=>{if((s[t]||[]).map(String).includes(String(nid))){c[t]++;if(hol)c.holiday++}});
   if(String(s.headNurse??'')===String(nid))c.head++;
 }
 return c;
}
function leaveDays(w,nid,k){
 const md=w.scheduleState?.months?.[k];if(!md)return 0;
 const [y,m]=k.split('-').map(Number),len=monthLen(y,m);let n=0;
 for(let d=1;d<=len;d++)if((md.leave?.[d]||[]).map(String).includes(String(nid)))n++;
 return n;
}
function calcPerson(w,n,k){
 const s=w.scheduleState;if(!s||!k)return {counts:{morning:0,evening:0,night:0,holiday:0,head:0},work:0,leave:0,total:0,target:0,diff:0};
 const md=s.months[k]||{},[y,m]=k.split('-').map(Number),len=monthLen(y,m),c=countShift(w,n.id,k);
 let work=0;
 for(let d=1;d<=len;d++){
   const hol=isHoliday(md,y,m,d),day=md.schedule[d]||{};
   SHIFTS.forEach(t=>{if((day[t]||[]).map(String).includes(String(n.id)))work+=workHoursFor(t,hol,s.settings)});
   if(String(day.headNurse??'')===String(n.id))work+=num(s.settings.morningHours);
 }
 const leave=leaveDays(w,n.id,k)*num(s.settings.leaveHours);
 const mm=w.monthly?.[k]||{};
 const target=mm.quota?.[n.id]!==undefined?num(mm.quota[n.id]):(mm.defaultQuota!==undefined?num(mm.defaultQuota):num(md.quotaOverrides?.[n.id]??md.quotaDefault));
 return {counts:c,work,leave,total:work+leave,target,diff:work+leave-target};
}
function constraintSummary(n){
 const c=n.monthlyConstraints||{},sr=c.shiftRules||{};
 const cannot=Array.isArray(sr.cannot)?sr.cannot:[];
 const minMax=sr.minMax||{};
 const consecutive=sr.consecutive||{};
 return {cannot,minMax,consecutive,overtimeRequestHours:num(c.overtimeRequestHours||c.hours?.overtimeRequestHours),raw:c};
}

function shiftCapacity(w,t){
 const c=w.capacity||{};
 const map={
  morning:{min:num(c.minMorning),max:num(c.maxMorning)},
  evening:{min:num(c.minEvening),max:num(c.maxEvening)},
  night:{min:num(c.minNight),max:num(c.maxNight)}
 };
 return map[t]||{min:0,max:0};
}
function coverageAudit(w,k){
 const out=[],s=w.scheduleState;
 if(!s||!s.months||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 for(let d=1;d<=len;d++){
  const day=md.schedule?.[d]||{};
  SHIFTS.forEach(t=>{
   const cap=shiftCapacity(w,t),count=(day[t]||[]).length;
   if(cap.min>0&&count<cap.min)
    out.push({level:'critical',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} فقط ${fa(count)} نفر دارد؛ حداقل مجاز ${fa(cap.min)} نفر است.`});
   if(cap.max>0&&count>cap.max)
    out.push({level:'warning',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} دارای ${fa(count)} نفر است؛ حداکثر مجاز ${fa(cap.max)} نفر است.`});
  });
 }
 return out;
}

function advancedAudit(w,k){
 const out=[],s=w.scheduleState;if(!s||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 // تعارض‌های آشکار روزانه
 for(let d=1;d<=len;d++){
   const seen={};const day=md.schedule[d]||{};
   SHIFTS.forEach(t=>(day[t]||[]).forEach(id=>{
     const z=String(id);seen[z]=(seen[z]||[]).concat(t);
   }));
   Object.entries(seen).forEach(([id,a])=>{
     if(a.length>2)out.push({level:'critical',text:`روز ${fa(d)}: ${nameOf(w,id)} بیش از دو شیفت دارد.`});
     if(a.includes('evening')&&a.includes('night'))out.push({level:'warning',text:`روز ${fa(d)}: ${nameOf(w,id)} همزمان عصر و شب ثبت شده است.`});
   });
 }
 // محدودیت‌های فردی موجود در فایل اصلی
 w.nurses.forEach(n=>{
   const c=constraintSummary(n),sr=c.raw.shiftRules||{};
   SHIFTS.forEach(t=>{
     const arr=sr.cannot||[];
     if(arr.includes(t)){
       for(let d=1;d<=len;d++)if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id)))
         out.push({level:'critical',text:`${n.name}: شیفت ${SHIFT_LABEL[t]} در محدودیت فردی ممنوع شده ولی ثبت شده است.`});
     }
     const mm=sr.minMax?.[t]||{},cnt=countShift(w,n.id,k)[t];
     if(num(mm.max)>0&&cnt>num(mm.max))out.push({level:'warning',text:`${n.name}: تعداد شیفت ${SHIFT_LABEL[t]} از حداکثر ${fa(mm.max)} بیشتر است.`});
     if(num(mm.min)>0&&cnt<num(mm.min))out.push({level:'warning',text:`${n.name}: حداقل ${fa(mm.min)} شیفت ${SHIFT_LABEL[t]} خواسته شده اما ${fa(cnt)} ثبت شده است.`});
     const lim=num(sr.consecutive?.[t]);if(lim>0){
       let run=0;
       for(let d=1;d<=len;d++){
         if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id))){run++;if(run>lim){out.push({level:'warning',text:`${n.name}: توالی شیفت ${SHIFT_LABEL[t]} از حد ${fa(lim)} بیشتر شده است.`});break}}
         else run=0;
       }
     }
   });
   const cannotDays=c.raw.cannotDays||c.raw.days?.cannot||[];
   if(Array.isArray(cannotDays))cannotDays.forEach(d=>{
     if((md.schedule[d]?.morning||[]).map(String).includes(String(n.id))||(md.schedule[d]?.evening||[]).map(String).includes(String(n.id))||(md.schedule[d]?.night||[]).map(String).includes(String(n.id)))
       out.push({level:'critical',text:`${n.name}: در روز ${fa(d)} محدودیت عدم حضور ثبت شده ولی شیفت دارد.`});
   });
 });
 return out.slice(0,100);
}

     const x=JSON.parse(await file.text()),m=normalizeDB(x);
     if(!m||!Array.isArray(m.wards))throw new Error('bad');
     db=m;saveDB();ui={view:'dashboard',wardId:null,module:'schedule',month:null};render();
     toast('بازیابی کامل انجام شد؛ اطلاعات نسخه‌های قبلی نیز در ساختار جدید نگهداری شد.')
   }catch(e){toast('فایل پشتیبان معتبر نیست یا ساختار آن قابل بازیابی نیست.')}
 })
}
function importWard(){
 const w=currentWard();if(!w)return;
 pick(async file=>{
   try{
     const p=JSON.parse(await file.text());
     if(!validOriginal(p))throw new Error('not-original');
     const oldRecords=w.records||{},oldMonthly=w.monthly||{},oldHistory=w.history||[];
     w.scheduleState=normalizeSchedule(p.state);
     w.nurses=clone(w.scheduleState.nurses);
     w.nurses.forEach(n=>{if(!n.requestKey)n.requestKey='nr-'+uid();if(n.loginPassword===undefined)n.loginPassword='';});
     w.scheduleState.nurses=w.nurses;
     w.records=oldRecords;w.monthly=oldMonthly;w.history=oldHistory;
     w.history.unshift({at:new Date().toISOString(),file:file.name,nurses:w.nurses.length,months:Object.keys(w.scheduleState.months).length});
     w.history=w.history.slice(0,30);
     saveDB();ui.month=monthKeys(w)[0]||null;render();
     toast('برنامه فقط برای همین بخش وارد شد و اطلاعات سایر بخش‌ها تغییر نکرد.')
   }catch(e){toast('این فایل باید دقیقاً خروجی «پشتیبان‌گیری» برنامه اصلی باشد.')}
 })
}

function allHospitalNurses(){
 const map={};
 db.wards.forEach(w=>{
   w.nurses.forEach(n=>{
     const key=(n.globalPersonnelId||n.name||String(n.id)).trim().toLowerCase();
     if(!map[key])map[key]={key,name:n.name||'بدون نام',wards:[],items:[]};
     map[key].wards.push(w.name);
     map[key].items.push({w,n});
   });
 });
 return Object.values(map);
}
function wardKpi(w,k){
 const nurses=w.nurses||[];
 let work=0,leave=0,total=0,overtime=0,shortage=0;
 nurses.forEach(n=>{
  const c=calcPerson(w,n,k);
  work+=c.work;leave+=c.leave;total+=c.total;
  if(c.diff>0)overtime+=c.diff; else shortage+=Math.abs(c.diff);
 });
 const audits=advancedAudit(w,k);
 const coverage=coverageAudit(w,k);
 const critical=audits.filter(x=>x.level==='critical').length;
 const warning=audits.filter(x=>x.level==='warning').length;
 const coverageCritical=coverage.filter(x=>x.level==='critical').length;
 const coverageWarning=coverage.filter(x=>x.level==='warning').length;
 const md=w.scheduleState?.months?.[k]||{};
 let shifts=0;
 Object.values(md.schedule||{}).forEach(d=>SHIFTS.forEach(t=>shifts+=(d[t]||[]).length));
 const cap=w.capacity||{};
 const days=Math.max(1,monthLen(...k.split('-').map(Number)));
 const minNeed=(cap.minMorning||0)*days+(cap.minEvening||0)*days+(cap.minNight||0)*days;
 const maxAllowed=(cap.maxMorning||0)*days+(cap.maxEvening||0)*days+(cap.maxNight||0)*days;
 const coveragePct=minNeed?Math.min(100,Math.round(shifts/minNeed*100)):null;
 return {nurses:nurses.length,work,leave,total,overtime,shortage,critical,warning,coverageCritical,coverageWarning,shifts,coveragePct,minNeed,maxAllowed};
}

function allPersonnel(){
 const map=new Map();
 (db.wards||[]).forEach(w=>(w.nurses||[]).forEach(n=>{
  const gid=String(n.globalPersonnelId||'').trim();
  const key=gid?`g:${gid}`:`n:${norm(n.name||'')}`;
  if(!map.has(key))map.set(key,{key,id:gid,name:n.name||'—',wards:[],refs:[]});
  const p=map.get(key);
  if(!p.wards.includes(w.name))p.wards.push(w.name);
  p.refs.push({w,n});
 }));
 return [...map.values()];
}

function metroEngine(){
 const results=[];

 // مرحله ۱ «مغز تصمیم‌گیر»: ابتدا کمبود واقعی هر شیفت/روز را پیدا می‌کنیم.
 db.wards.forEach(w=>monthKeys(w).forEach(k=>{
  const md=w.scheduleState?.months?.[k]; if(!md)return;
  const cap=w.capacity||{}, [y,m]=k.split('-').map(Number),len=monthLen(y,m);

  SHIFTS.forEach(sh=>{
   const key=sh==='morning'?'minMorning':sh==='evening'?'minEvening':'minNight';
   const min=Number(cap[key]||0); if(!min)return;

   let shortage=0, days=[];
   for(let d=1;d<=len;d++){
    const assigned=(md.schedule?.[d]?.[sh]||[]).map(String);
    const missing=Math.max(0,min-assigned.length);
    if(missing){
      shortage+=missing;
      days.push({day:d,missing,assigned});
    }
   }
   if(shortage)results.push({ward:w,month:k,shift:sh,shiftLabel:SHIFT_LABEL[sh],shortage,days});
  });
 }));

 // کاندیدها: فعال، خارج از بخش مقصد، و ترجیحاً بدون شیفت همزمان.
 function candidateScore(n,w,k,sh,days){
  let score=100, reasons=[];
  const md=w.scheduleState?.months?.[k];
  if(!md)return {score:0,reasons:['برنامه ماه موجود نیست']};

  let conflicts=0, assignedCount=0;
  days.forEach(x=>{
   const ids=(md.schedule?.[x.day]?.[sh]||[]).map(String);
   if(ids.includes(String(n.id)))conflicts++;
   SHIFTS.forEach(t=>{
    if((md.schedule?.[x.day]?.[t]||[]).map(String).includes(String(n.id)))assignedCount++;
   });
  });

  if(conflicts){
   score-=70;
   reasons.push('در یکی از روزهای کسری، همین شیفت را دارد');
  } else {
   reasons.push('تعارض مستقیم با شیفت هدف پیدا نشد');
  }

  if(assignedCount===0){
   score+=15;
   reasons.push('در روزهای کسری شیفت ثبت‌شده‌ای ندارد');
  } else if(assignedCount<=2){
   score+=5;
   reasons.push('تعداد شیفت‌های ثبت‌شده در روزهای کسری کم است');
  } else {
   score-=10;
   reasons.push('در روزهای کسری چند شیفت ثبت‌شده دارد');
  }

  // اگر اطلاعات موظفی/کارکرد در سیستم موجود باشد، از آن فقط به‌عنوان سیگنال کمکی استفاده می‌کنیم.
  try{
   const c=calcPerson(w,n,k);
   if(c && Number(c.diff)>0){
    score+=10;
    reasons.push('در محاسبه کارکرد ماه، ظرفیت اضافه‌کار/مازاد دارد');
   } else if(c && Number(c.diff)<0){
    score-=5;
    reasons.push('در محاسبه کارکرد ماه کسری دارد');
   }
  }catch(_){}

  return {score,reasons};
 }

 const suggestions=results.map(r=>{
  const candidates=[];

  db.wards.filter(w=>w.id!==r.ward.id).forEach(w=>{
   (w.nurses||[]).filter(n=>n.active!==false).forEach(n=>{
    const s=candidateScore(n,w,r.month,r.shift,r.days);
    candidates.push({
      id:String(n.id),
      name:n.name||'بدون نام',
      ward:w.name||'بخش نامشخص',
      score:s.score,
      reasons:s.reasons
    });
   });
  });

  candidates.sort((a,b)=>b.score-a.score);

  const top=candidates.slice(0,8);
  const candidateHtml=top.map((c,i)=>{
    const badge=c.score>=110?'پیشنهاد اولیه':c.score>=90?'قابل بررسی':'نیازمند بررسی';
    const key=`${r.ward.id}|${r.month}|${r.shift}|${c.id}`;
    const past=(db.aiLearning||[]).filter(x=>x.key===key);
    const accepted=past.filter(x=>x.decision==='accepted').length;
    const rejected=past.filter(x=>x.decision==='rejected').length;
    return `<div class="notice" style="margin:4px 0">
      <b>${fa(i+1)}. ${esc(c.name)}</b> — ${esc(c.ward)}
      <span class="muted"> | ${badge} | امتیاز داخلی: ${fa(Math.max(0,c.score))}</span>
      ${past.length?`<span class="muted"> | سابقه: تأیید ${fa(accepted)} / رد ${fa(rejected)}</span>`:''}
      <div class="muted">${esc(c.reasons.join('؛ '))}</div>
      <div class="actions">
       <button type="button" class="btn ok small" data-ai-feedback="accepted" data-ai-key="${esc(key)}" data-ai-name="${esc(c.name)}">✓ تأیید پیشنهاد</button>
       <button type="button" class="btn bad small" data-ai-feedback="rejected" data-ai-key="${esc(key)}" data-ai-name="${esc(c.name)}">✕ رد پیشنهاد</button>
      </div>
    </div>`;
  }).join('') || 'نیروی کاندید ثبت نشده';

  const first=top[0];
  const decision=first
    ? `بررسی اولیه ${first.name} از ${first.ward}`
    : 'کاندید مناسبی برای بررسی اولیه پیدا نشد';

  return `<tr>
    <td>${esc(r.ward.name)}</td>
    <td>${monthTitle(r.month)}</td>
    <td>${esc(r.shiftLabel)}</td>
    <td>${fa(r.shortage)}</td>
    <td>${esc(r.days.map(x=>x.day).join('، '))}</td>
    <td>${candidateHtml}<div class="notice ok"><b>اقدام پیشنهادی:</b> ${esc(decision)} — تأیید نهایی فقط با مترون.</div></td>
  </tr>`;
 }).join('');

 const learn=db.aiLearning||[];
 const acceptedLearn=learn.filter(x=>x.decision==='accepted').length;
 const rejectedLearn=learn.filter(x=>x.decision==='rejected').length;
 const feedbackPanel=`<div class="card"><div class="title">📚 یادگیری از تصمیم‌های مترون</div>
   <div class="notice">هر بار که مترون یک پیشنهاد را تأیید یا رد کند، نتیجه فقط به‌عنوان سابقه تصمیم ثبت می‌شود. این داده‌ها فعلاً برای نمایش سابقه و آماده‌سازی مرحله یادگیری استفاده می‌شوند.</div>
   <div class="statgrid"><div class="stat"><b>${fa(acceptedLearn)}</b><span>پیشنهاد تأییدشده</span></div><div class="stat"><b>${fa(rejectedLearn)}</b><span>پیشنهاد ردشده</span></div><div class="stat"><b>${fa(learn.length)}</b><span>کل بازخوردها</span></div></div></div>`;
 return feedbackPanel+`<div class="card">
   <div class="title">🧠 موتور تصمیم‌یار مترون — مرحله ۲</div>
   <div class="notice">
     این موتور ابتدا کمبود را بر اساس حداقل نیروی تعریف‌شده شناسایی می‌کند،
     سپس کاندیدها را با توجه به فعال بودن، تعارض شیفت و سیگنال‌های موجود از کارکرد مرتب می‌کند.
     <b>این امتیاز «استاندارد قانونی» یا تصمیم قطعی نیست و هیچ جابه‌جایی خودکاری انجام نمی‌شود.</b>
   </div>
   <div class="tablewrap"><table>
    <tr>
      <th>بخش نیازمند نیرو</th><th>ماه</th><th>شیفت</th>
      <th>مجموع کسری</th><th>روزهای دارای کسری</th><th>کاندیدهای رتبه‌بندی‌شده و اقدام پیشنهادی</th>
    </tr>
    ${suggestions||'<tr><td colspan="6">بر اساس حداقل‌های تعریف‌شده، کمبود قابل شناسایی وجود ندارد.</td></tr>'}
   </table></div>
 </div>`;
}

function importNurseRequestFor(id){

 input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{
   const p=JSON.parse(await file.text()); if(p.__app!=='درخواست و محدودیت پرستار' || !p.data)throw new Error('bad');
   const pgid=String(p.nurse?.globalPersonnelId||'').trim(), pname=proposalNormalizeName(p.nurse?.name), pward=proposalNormalizeName(p.nurse?.wardName);
   // این فایل از داخل «پرونده همان پرستار» بارگذاری می‌شود؛ بنابراین پرستار انتخاب‌شده مرجع قطعی است.

   let n=target;
   if(!n){
     const candidates=nurses.filter(x=>
       (p.requestKey&&x.requestKey&&p.requestKey===x.requestKey) ||
       (pgid&&String(x.globalPersonnelId||'').trim()===pgid) ||
       (pname&&proposalNormalizeName(x.name)===pname)
     );
     if(candidates.length===1)n=candidates[0];
   }
   if(!n){toast('⚠️ پرستار مقصد برای بارگذاری مشخص نیست. ابتدا از پرونده همان پرستار روی «بارگذاری فایل درخواست‌ها» بزنید.');return;}
   n.requestProposals=n.requestProposals&&typeof n.requestProposals==='object'?n.requestProposals:{};

   const directory=Array.isArray(p.peopleDirectory)?p.peopleDirectory:[];
   const mapPersonId=(rawId)=>{const info=directory.find(x=>Number(x.id)===Number(rawId));if(!info)return Number(rawId);const gid=String(info.globalPersonnelId||'').trim(),nm=proposalNormalizeName(info.name||'');const dest=(gid&&nurses.find(x=>String(x.globalPersonnelId||'').trim()===gid))||(nm&&nurses.find(x=>proposalNormalizeName(x.name||'')===nm));return dest?Number(dest.id):Number(rawId);};
   Object.keys(incoming).forEach(k=>{const c=normalizeProposalMonth(incoming[k]);['noWith'].forEach(key=>{if(Array.isArray(c[key]))c[key]=c[key].map(mapPersonId);});['noWith','preferNoWith','mustWith','preferWith'].forEach(key=>{if(Array.isArray(c.people[key]))c.people[key]=c.people[key].map(mapPersonId);});c.noWith=c.people.noWith.slice();incoming[k]=c;});

   months.forEach(k=>{n.requestProposals[k]={id:uid(),importedAt:new Date().toISOString(),sourceFile:file.name,requestKey:p.requestKey||'',nurse:clone(p.nurse||{}),data:{preferences:{[k]:prefs[k]||{}},softPreferences:{[k]:soft[k]||{}},monthlyConstraints:{[k]:incoming[k]||{}},note:String(p.data.note||'')},approved:{}};});
   saveDB();ui.proposalNurseId=n.id;ui.proposalMonthKey=months[0];openRequestProposalPanel(w.id);toast('فایل وارد شد؛ همه بخش‌های درخواست و محدودیت‌های فردی برای بررسی نمایش داده می‌شوند.');
 }catch(e){console.error(e);toast('فایل معتبر درخواست و محدودیت پرستار انتخاب نشده است.');}};input.click();

   db.wards.push(w);db.auth=db.auth&&typeof db.auth==='object'?db.auth:{};db.auth.wardPasswords=db.auth.wardPasswords&&typeof db.auth.wardPasswords==='object'?db.auth.wardPasswords:{};db.auth.wardPasswords[String(w.id)]=supervisorPassword;saveDB();ui.view='ward';ui.wardId=w.id;ui.module='schedule';ui.month=null;render();return
 }
 if(action==='import'){importWard();return}
 if(action==='exportward'){exportWard();return}
 if(action==='audit'){auditModal();return}
 if(action==='history'){historyModal();return}
 if(action==='transfer'){transferModal();return}
 if(action==='staffmovement'){staffMovementModal();return}
 if(action==='savetriaage'){saveTriage();return}
 if(action==='cleartriage'){clearTriage();return}
 if(action==='addshift'){
   const w=currentWard(),k=ui.month||monthKeys(w)[0];
   if(!w?.scheduleState)return toast('ابتدا برنامه را وارد کنید.');
   const md=w.scheduleState.months[k]||{},[y,m]=k.split('-').map(Number),len=monthLen(y,m);
   openModal('انتخاب روز برای مدیریت شیفت',`<label>روز<select id="pickDay">${Array.from({length:len},(_,i)=>`<option value="${i+1}">${fa(i+1)} — ${jalaliWeekday(y,m,i+1)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="btn pri" data-openpickedday>ادامه</button></div>`);
   return
 }
 if(action==='addleave'){
   const w=currentWard(),k=ui.month||monthKeys(w)[0]; if(!w?.scheduleState)return toast('ابتدا برنامه را وارد کنید.');
   const [y,m]=k.split('-').map(Number),len=monthLen(y,m);
   openModal('انتخاب روز مرخصی/غیبت',`<label>روز<select id="pickLeaveDay">${Array.from({length:len},(_,i)=>`<option value="${i+1}">${fa(i+1)} — ${jalaliWeekday(y,m,i+1)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="btn pri" data-openpickedleave>ادامه</button></div>`);
   return
 }
 if(action==='savequota'){
   const w=currentWard(),k=ui.month;if(!w||!k)return;
   w.monthly[k]=w.monthly[k]||{quota:{},extra:{}};
   w.monthly[k].defaultQuota=num(document.getElementById('defaultQuota').value);
   saveDB();render();toast('موظفی پیش‌فرض ماه ذخیره شد.');return
 }
 if(action==='editward'){
   const w=currentWard();if(!w)return;
   const cap=w.capacity||{};
   openModal('ویرایش بخش',`<label>نام<input id="en" value="${esc(w.name)}"></label><label>کد<input id="ec" value="${esc(w.code||'')}"></label><label>توضیحات<textarea id="ed">${esc(w.desc||'')}</textarea></label>
   <div class="row"><label>تعداد تخت<input id="ebeds" type="number" min="0" value="${num(cap.beds)}"></label>
<label>صبح حداقل<input id="eminm" type="number" min="0" value="${num(cap.minMorning)}"></label><label>صبح حداکثر<input id="emaxm" type="number" min="0" value="${num(cap.maxMorning)}"></label>
<label>عصر حداقل<input id="emine" type="number" min="0" value="${num(cap.minEvening)}"></label><label>عصر حداکثر<input id="emaxe" type="number" min="0" value="${num(cap.maxEvening)}"></label>
<label>شب حداقل<input id="eminn" type="number" min="0" value="${num(cap.minNight)}"></label><label>شب حداکثر<input id="emaxn" type="number" min="0" value="${num(cap.maxNight)}"></label></div>
   <div class="actions"><button type="button" class="btn ok" data-saveward>ذخیره</button></div>`);return
 }
 if(action==='deleteward'){
   if(confirm('تمام اطلاعات این بخش حذف شود؟ این کار قابل بازگشت نیست مگر از پشتیبان.')){db.wards=db.wards.filter(w=>w.id!==ui.wardId);saveDB();ui={view:'dashboard',wardId:null,module:'schedule',month:null};render()}return
 }
 if(action==='exportcsv'){csvDownload();return}
 if(action==='record'){recordModal(btn.dataset.record);return}
 if(action==='saveprofile'){const w=currentWard(),n=w.nurses.find(x=>String(x.id)===String(btn.dataset.saveprofile));if(n){n.name=document.getElementById('pn').value.trim()||n.name;n.globalPersonnelId=document.getElementById('pgid').value.trim();n.active=document.getElementById('pa').value==='true';n.metronNote=document.getElementById('pnote').value;n.loginPassword=document.getElementById('plogin')?.value||'';db.auth=db.auth&&typeof db.auth==='object'?db.auth:{};db.auth.nursePasswords=db.auth.nursePasswords&&typeof db.auth.nursePasswords==='object'?db.auth.nursePasswords:{};db.auth.nursePasswords[String(w.id)+'::'+String(n.id)]=n.loginPassword;if(!n.requestKey)n.requestKey='nr-'+uid();logActivity('personnel-profile',{ward:w.name,nurse:n.name});saveDB();closeModal();render();toast('پرونده ذخیره شد.')}return}
 if(action==='saveleave'){return}

 const pi=btn.dataset.personnel;if(pi!==undefined){personnelModal(Number(pi));return}
 const ow=btn.dataset.openwardfromperson;if(ow){ui.view='ward';ui.wardId=ow;ui.module='schedule';ui.month=null;closeModal();render();return}
 if(btn.hasAttribute('data-transfer-save')){saveTransfer();return}
 if(btn.hasAttribute('data-savestaffmovement')){saveStaffMovement();return}
 const dm=btn.dataset.delmovement;if(dm!==undefined){const w=currentWard();const r=w?.staffMovements?.[Number(dm)];if(r&&confirm('این رکورد مدیریتی حذف شود؟')){w.staffMovements.splice(Number(dm),1);saveDB();render();}return}
 const wardBtn=btn.dataset.openward;
 if(wardBtn){ui.view='ward';ui.wardId=wardBtn;ui.module='schedule';ui.month=null;closeModal();render();return}
 const qi=btn.dataset.quickimport;if(qi){ui.view='ward';ui.wardId=qi;ui.module='schedule';ui.month=null;render();setTimeout(importWard,50);return}

 if(btn.hasAttribute('data-openpickedday')){shiftModal(Number(document.getElementById('pickDay').value));return}
 if(btn.hasAttribute('data-openpickedleave')){leaveModal(Number(document.getElementById('pickLeaveDay').value));return}
 const mod=btn.dataset.module;
 if(mod){ui.view='ward';ui.module=mod;render();return}

 const prof=btn.dataset.profile;if(prof){profileModal(prof);return}
 const con=btn.dataset.constraints;if(con){constraintsModal(con);return}
 const ph=btn.dataset.personhours;if(ph){editHoursModal(ph);return}
 const ld=btn.dataset.leaveday;if(ld){leaveModal(Number(ld));return}
 const de=btn.dataset.dayedit;if(de){shiftModal(Number(de));return}
 const sr=btn.dataset.saveshift;if(sr){saveShift(Number(sr));return}
 const sl=btn.dataset.saveleave;if(sl){saveLeave(Number(sl));return}
 const sp=btn.dataset.savepersonhours;if(sp){savePersonHours(sp);return}
 const sc=btn.dataset.saveconstraints;if(sc){saveConstraints(sc);return}
 const sv=btn.dataset.saverecord;if(sv){saveRecord(sv);return}
 const dr=btn.dataset.delrecord;if(dr){const [k,i]=dr.split('|');const w=currentWard();(w.records[k]||[]).splice(Number(i),1);saveDB();render();return}
 const sw=btn.hasAttribute('data-saveward');if(sw){const w=currentWard();w.name=document.getElementById('en').value.trim()||w.name;w.code=document.getElementById('ec').value;w.desc=document.getElementById('ed').value;w.capacity={beds:num(document.getElementById('ebeds').value),minMorning:num(document.getElementById('eminm').value),maxMorning:num(document.getElementById('emaxm').value),minEvening:num(document.getElementById('emine').value),maxEvening:num(document.getElementById('emaxe').value),minNight:num(document.getElementById('eminn').value),maxNight:num(document.getElementById('emaxn').value)};saveDB();closeModal();render();return}
 const ep=btn.dataset.personhours; if(ep){editHoursModal(ep);return}
});

document.addEventListener('change',function(e){
 if(e.target.id==='wardMonth'||e.target.id==='triageMonth'){ui.month=e.target.value;render();return}
 if(e.target.id==='metroMonth'){ui.metroMonth=e.target.value;render();return}
 if(e.target.id==='compareMonth'){ui.compareMonth=e.target.value;render();return}

});

function editHoursModal(id){
 const w=currentWard(),n=w.nurses.find(x=>String(x.id)===String(id)),k=ui.month||monthKeys(w)[0],m=w.monthly[k]||{quota:{},extra:{}};
 openModal('تنظیم کارکرد — '+esc(n.name),`<label>موظفی اختصاصی<input id="hq" type="number" value="${m.quota?.[id]??m.defaultQuota??0}"></label><label>اضافه‌کار ثبت‌شده/مدیریتی<input id="he" type="number" min="0" value="${m.extra?.[id]||0}"></label><div class="actions"><button type="button" class="btn ok" data-savepersonhours="${id}">ذخیره</button></div>`);
}
function savePersonHours(id){
 const w=currentWard(),k=ui.month||monthKeys(w)[0];w.monthly[k]=w.monthly[k]||{quota:{},extra:{}};w.monthly[k].quota=w.monthly[k].quota||{};w.monthly[k].extra=w.monthly[k].extra||{};
 w.monthly[k].quota[id]=num(document.getElementById('hq').value);w.monthly[k].extra[id]=num(document.getElementById('he').value);
 saveDB();closeModal();render();
}
function saveConstraints(id){
 const w=currentWard(),n=w.nurses.find(x=>String(x.id)===String(id));if(!n)return;
 n.monthlyConstraints=n.monthlyConstraints||{};n.monthlyConstraints.shiftRules=n.monthlyConstraints.shiftRules||{};
 const sr=n.monthlyConstraints.shiftRules;sr.cannot=[];SHIFTS.forEach(t=>{if(document.querySelector(`[data-cannot="${t}"]`)?.checked)sr.cannot.push(t)});
 sr.minMax=sr.minMax||{};sr.consecutive=sr.consecutive||{};
 SHIFTS.forEach(t=>{sr.minMax[t]={min:num(document.getElementById('min_'+t).value),max:num(document.getElementById('max_'+t).value)};sr.consecutive[t]=num(document.getElementById('con_'+t).value)});
 n.monthlyConstraints.overtimeRequestHours=num(document.getElementById('otreq').value);
 saveDB();closeModal();render();toast('محدودیت‌های فردی ذخیره شد.')
}
function saveLeave(day){
 const w=currentWard(),k=ui.month||monthKeys(w)[0],md=w.scheduleState.months[k];
 const ids=[...document.querySelectorAll('[data-leaveperson]:checked')].map(x=>x.dataset.leaveperson);
 md.leave=md.leave||{};md.leave[day]=ids;
 const key='leave',arr=ensureRecords(w)[key]||[];arr.push({id:uid(),date:`${k}-${day}`,title:'مرخصی/غیبت',text:document.getElementById('leaveReason').value,nurseId:ids[0]||''});
 w.records[key]=arr;saveDB();closeModal();render();
}
function saveShift(day){
 const w=currentWard(),k=ui.month||monthKeys(w)[0],md=w.scheduleState.months[k];
 md.schedule=md.schedule||{};md.schedule[day]=md.schedule[day]||{};
 SHIFTS.forEach(t=>md.schedule[day][t]=[...document.getElementById('sh_'+t).selectedOptions].map(o=>o.value));
 const h=document.getElementById('head').value;md.schedule[day].headNurse=h||null;
 logActivity('schedule-edit',{ward:w.name,month:k,day});saveDB();closeModal();render();toast('برنامه روز ذخیره شد؛ ساعات و هشدارها دوباره محاسبه شدند.')
}
function saveRecord(key){
 if(key==='load'){
  const w=currentWard();w.records=w.records||{};w.records.load=w.records.load||[];
  w.records.load.push({
   date:document.getElementById('r0')?.value||'',
   patients:num(document.getElementById('r1')?.value),
   acuity:document.getElementById('r2')?.value||'',
   text:document.getElementById('r3')?.value||''
  });
  saveDB();closeModal();render();toast('وضعیت بار بیمار ثبت شد.');return;
 }
 const w=currentWard();w.records=w.records||{};w.records[key]=w.records[key]||[];
 w.records[key].push({id:uid(),date:document.getElementById('rdate').value,nurseId:document.getElementById('rnurse').value,title:document.getElementById('rtitle').value.trim(),text:document.getElementById('rtext').value});
 saveDB();closeModal();render();
}

(async function start(){
 initDefaultMonth();
 const cloudData = await loadDBFromCloud();
 if(cloudData && Array.isArray(cloudData.wards)){
   db = cloudData;
   localStorage.setItem(KEY, JSON.stringify(db)); // پشتیبان محلی
 } else {
   await loadData();
 }
 render();
})();

document.addEventListener('click',function(e){
 const fb=e.target.closest('[data-ai-feedback]');
 if(!fb)return;
 const decision=fb.dataset.aiFeedback;
 const key=fb.dataset.aiKey;
 if(!decision||!key)return;
 db.aiLearning=Array.isArray(db.aiLearning)?db.aiLearning:[];
 db.aiLearning.push({id:uid(),at:new Date().toISOString(),key,decision,nurseName:fb.dataset.aiName||'',source:'metro-engine'});
 logActivity('ai-feedback',{key,decision,nurseName:fb.dataset.aiName||''});
 saveDB();
 toast(decision==='accepted'?'بازخورد «تأیید» ثبت شد.':'بازخورد «رد» ثبت شد.');
 render();
});

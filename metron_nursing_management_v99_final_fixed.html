<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08161a">
<title>سامانه مدیریت مترون بیمارستان — نسخه ۱۰</title>
<style>
:root{
 --bg:#071114;--panel:#0d1c20;--panel2:#11262b;--line:#29434a;
 --text:#eef8f7;--muted:#91a7aa;--pri:#36c7c1;--ok:#55d58f;
 --bad:#ff6b6b;--warn:#efc56c;--shadow:0 12px 32px #0005
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
header{position:sticky;top:0;z-index:50;background:#09181cdd;backdrop-filter:blur(10px);border-bottom:1px solid #214047}
.head{max-width:1500px;margin:auto;padding:13px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px}.sub{color:var(--muted);font-size:10px;margin-top:4px}.grow{flex:1}
main{max-width:1500px;margin:auto;padding:12px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.btn{appearance:none;border:1px solid #345159;background:#12262c;color:#e4f8f6;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer;min-height:40px}
.btn:active{transform:translateY(1px)}.btn.pri{background:#146c70;border-color:#49d6cf}.btn.ok{background:#155f40;border-color:#55d58f}
.btn.bad{background:#63252c;border-color:#ff6b6b}.btn.warn{background:#5b4619;border-color:#efc56c}
.btn.active{background:#146c70;border-color:#49d6cf}
.btn.small{padding:7px 9px;min-height:34px;font-size:10px}
.card{background:linear-gradient(145deg,#102024,#0b181c);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:10px}
.title{font-size:16px;font-weight:900;margin-bottom:10px}
.notice{padding:11px;border-radius:11px;background:#102a2f;border:1px solid #31545b;font-size:11px;line-height:1.9;margin:8px 0}
.notice.warn{background:#302719;border-color:#735b2a}.notice.bad{background:#321d22;border-color:#71353b}.notice.ok{background:#102a20;border-color:#356e50}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
label{display:block;font-size:11px;font-weight:800;margin:6px 0}
input,select,textarea{width:100%;background:#09171b;color:var(--text);border:1px solid #2b464d;border-radius:9px;padding:9px;font-size:12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tabs{display:flex;gap:7px;overflow-x:auto;overflow-y:visible;padding:3px 1px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.tabs .btn{flex:0 0 auto}
.tablewrap{overflow:auto;border:1px solid #263e44;border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:10.5px;min-width:640px}
th,td{border:1px solid #263e44;padding:7px;text-align:center;vertical-align:middle}
th{background:#14292e;color:#d8efed;font-weight:900}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17373b}
.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}
.progress{height:8px;background:#17272b;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pri)}
.wardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.wardcard{cursor:pointer;transition:.12s}.wardcard:hover{transform:translateY(-1px);border-color:#46737a}
.wardhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.module-btn{min-height:58px;text-align:right}
.module-btn b{display:block;font-size:11px}.module-btn span{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.stat{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.stat b{font-size:20px;display:block}.stat span{font-size:9px;color:var(--muted)}
.shiftcell{padding:5px;border-radius:8px;margin:2px 0;background:#173034}
.shiftcell.m{background:#3b2d1a}.shiftcell.e{background:#3b231d}.shiftcell.n{background:#242840}
.person-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.person{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.modalbg{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:#0e1d21;border:1px solid #3b5b63;border-radius:16px;width:min(920px,100%);max-height:92vh;overflow:auto;padding:15px}
.modal h2{font-size:15px;margin:0 0 10px}.close{float:left}
footer{text-align:center;color:#657c80;padding:24px;font-size:10px}
hr{border:0;border-top:1px solid #263e44;margin:13px 0}
@media(max-width:700px){
 .head{padding:10px}.brand{font-size:15px}.sub{font-size:9px}
 main{padding:8px}.card{padding:11px}.grid{grid-template-columns:1fr 1fr}
 .module-grid{grid-template-columns:1fr 1fr}.module-btn{min-height:64px}
 .wardgrid{grid-template-columns:1fr}.btn{min-height:42px}
}
.server-request-card{margin-bottom:14px;padding:12px;border:1px solid #31545d;border-radius:14px;background:#10262b}.server-request-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.server-request{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border-top:1px solid #31545d}.server-request small{display:block;color:var(--muted);margin-top:5px}.server-request .actions{margin:0}<style>.training-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.training-step{margin:0}.training-step .title{margin-bottom:8px}.training-step div:last-child{line-height:1.9}</style></style>
<style id="supervisor-integration-v14">
.supervisor-modal{position:fixed;inset:0;z-index:99999;background:#071114;display:flex;flex-direction:column;}
.supervisor-top{height:54px;min-height:54px;background:#0b1b20;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;box-sizing:border-box;border-bottom:1px solid rgba(255,255,255,.12)}
.supervisor-title{font-weight:900;font-size:14px;margin-inline-start:auto;}
.supervisor-frame{width:100%;height:calc(100vh - 54px);border:0;background:#f3f5f7;display:block;}
@media(max-width:600px){.supervisor-top{height:50px;min-height:50px}.supervisor-frame{height:calc(100vh - 50px)}.supervisor-title{font-size:12px}.supervisor-top .btn{font-size:11px;padding:7px 9px}}
</style>
<style id="proposal-css">
.proposal-section{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)}
.proposal-section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.proposal-body{line-height:1.9;font-size:12px;margin-bottom:8px}
</style>

<style id="server-delete-css">
.server-delete-note{margin-top:8px;font-size:10px;color:var(--muted);line-height:1.8}
</style>
<style id="user-management-css">
.user-management-card{border:1px solid #31545d;border-radius:14px;padding:14px;background:#10262b;margin-bottom:12px}
.user-management-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.user-management-note{font-size:11px;line-height:1.9;color:var(--muted);margin:8px 0}
.user-management-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px;margin-top:10px}
.user-management-item{border:1px solid #29434a;border-radius:11px;padding:10px;background:#0b1b1f}
.user-management-item b{display:block;margin-bottom:5px}
.user-management-role{font-size:10px;color:var(--muted)}
.remember-login{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}.remember-login input{width:18px!important;min-height:18px!important;accent-color:var(--pri)}
</style>
</head>

function supervisorSourceForWard(wid){
 const safe=String(wid).replace(/[^a-zA-Z0-9_-]/g,'_');
 const stateKey='metron-supervisor-state-'+safe;
 return SUPERVISOR_SOURCE.replace(/__METRON_STATE_KEY__/g,stateKey).replace(/__METRON_HISTORY_KEY__/g,stateKey+'-history');
}
function mergeSupervisorStateForWard(w){
 const base=clone(w?.scheduleState||{});
 base.nurses=Array.isArray(base.nurses)?base.nurses:[];
 const byKey=new Map();
 (w?.nurses||[]).forEach(n=>{
   const key=n.globalPersonnelId?('g:'+String(n.globalPersonnelId).trim()):('n:'+proposalNormalizeName(n.name||''));
   if(key)byKey.set(key,n);
 });
 const used=new Set();
 base.nurses=base.nurses.map(sn=>{
   const key=sn.globalPersonnelId?('g:'+String(sn.globalPersonnelId).trim()):('n:'+proposalNormalizeName(sn.name||''));
   const mn=key?byKey.get(key):null;
   if(mn){used.add(mn.id);const merged=Object.assign(clone(sn),clone(mn),{id:sn.id});['preferences','softPreferences','monthlyConstraints','nurseRequestNote','globalPersonnelId','requestKey','requestProposals'].forEach(k=>{if(mn[k]!==undefined)merged[k]=clone(mn[k]);});return merged;}
   return sn;
 });
 (w?.nurses||[]).forEach(n=>{if(used.has(n.id))return; const key=n.globalPersonnelId?('g:'+String(n.globalPersonnelId).trim()):('n:'+proposalNormalizeName(n.name||'')); if(!base.nurses.some(sn=>{const sk=sn.globalPersonnelId?('g:'+String(sn.globalPersonnelId).trim()):('n:'+proposalNormalizeName(sn.name||''));return sk===key;}))base.nurses.push(clone(n));});
 base.nurses.forEach(n=>{if(n.active===undefined)n.active=true;});
 return base;
}

function ensureSupervisorPlanningData(){
 db.hospital=db.hospital&&typeof db.hospital==='object'?db.hospital:{name:'بیمارستان',year:'۱۴۰۵-۱۴۰۶'};
 db.hospital.supervisorAssignments=db.hospital.supervisorAssignments&&typeof db.hospital.supervisorAssignments==='object'?db.hospital.supervisorAssignments:{};
 const year=Number(String(db.hospital?.year||'1405').match(/\d+/)?.[0]||1405);
 const er=db.wards.find(w=>/اورژانس|emergency|ER/i.test(String(w.name||'')+' '+String(w.code||'')));
 if(er){for(let mi=1;mi<=12;mi++){const k=`${year}-${mi}`,a=db.hospital.supervisorAssignments[k];if(!a||!Object.keys(a).length){const plan={};for(let d=1;d<=monthLen(year,mi);d++)plan[String(d)]={morning:String(er.id),evening:String(er.id),night:String(er.id)};db.hospital.supervisorAssignments[k]=plan;}}}
 return db.hospital.supervisorAssignments;
}

function monthTitle(k){if(typeof k!=='string'||!/^-?\d{4}-\d{1,2}$/.test(k))return '—';let [y,m]=k.split('-').map(Number);return `${MONTHS[m-1]||'ماه نامشخص'} ${fa(y)}`}
function monthKeys(w){const src=w?.scheduleState?.months;const keys=src&&typeof src==='object'&&!Array.isArray(src)?Object.keys(src):[];return keys.filter(k=>/^\d{4}-(?:[1-9]|1[0-2])$/.test(k)).sort((a,b)=>{let x=a.split('-').map(Number),y=b.split('-').map(Number);return x[0]-y[0]||x[1]-y[1]})}

const MOVEMENT_SHIFT_OPTIONS=[
 ['morning','صبح'],['evening','عصر'],['night','شب'],
 ['morning+evening','صبح + عصر'],['morning+night','صبح + شب'],
 ['as_needed','بنابه نیاز بخش']
];
function expandMovementShift(shift){
 if(shift==='morning+evening')return ['morning','evening'];
 if(shift==='morning+night')return ['morning','night'];
 if(shift==='as_needed')return ['morning','evening','night'];
 return ['morning','evening','night'].includes(shift)?[shift]:[];
}

function normalizeSchedule(s){
 s=clone(s||{});
 s.nurses=Array.isArray(s.nurses)?s.nurses:[];
 s.settings=Object.assign({},DEF,s.settings||{});
 s.months=s.months&&typeof s.months==='object'?s.months:{};
 s.nurses.forEach(n=>{
   n.active=n.active!==false;
   n.preferences=n.preferences||{};
   n.softPreferences=n.softPreferences||{};
   n.monthlyConstraints=n.monthlyConstraints||{};
 });
 Object.values(s.months).forEach(m=>{
   m.schedule=m.schedule&&typeof m.schedule==='object'?m.schedule:{};
   m.leave=m.leave&&typeof m.leave==='object'?m.leave:{};
   m.holidays=Array.isArray(m.holidays)?m.holidays:[];
   if(m.quotaDefault===undefined)m.quotaDefault=0;
   m.quotaOverrides=m.quotaOverrides&&typeof m.quotaOverrides==='object'?m.quotaOverrides:{};
 });

}

       // مهم: قبلاً اینجا w.nurses به‌طور کامل با w.scheduleState.nurses جایگزین می‌شد.
       // چون درخواست‌های روزانه/پیشنهادی پرستار (preferences, softPreferences, monthlyConstraints,

       // برنامه‌ریز شیفت) وجود ندارند، این جایگزینی هر بار که داده از Supabase تازه می‌شد
       // (مثلاً همین که سرپرستار پنل «درخواست و محدودیت پیشنهادی» را باز می‌کرد) درخواست تازه
       // پرستار را پاک می‌کرد. اینجا به‌جای جایگزینی، دو آرایه را بر اساس id ادغام می‌کنیم.
       const byId={};

           softPreferences:(existing.softPreferences&&Object.keys(existing.softPreferences).length)?existing.softPreferences:(sn.softPreferences||{}),

   });

   const sentMissionIds=new Set();
   y.wards.forEach(w=>{

function loadDB(){
 try{
   const primary=localStorage.getItem(KEY);
   if(primary){const x=normalizeDB(JSON.parse(primary));if(x&&Array.isArray(x.wards))return x;}
   const safe=localStorage.getItem(KEY+'::safe');
   if(safe){const pack=JSON.parse(safe),x=normalizeDB(pack?.db);if(x&&Array.isArray(x.wards)){localStorage.setItem(KEY,JSON.stringify(x));return x;}}
   for(const k of LEGACY_KEYS){
     const raw=localStorage.getItem(k);if(!raw)continue;
     const x=normalizeDB(JSON.parse(raw));
     if(x&&Array.isArray(x.wards)){localStorage.setItem(KEY,JSON.stringify(x));return x;}
   }
 }catch(e){console.warn(e)}
 return emptyDB();
}

async function loadDBFromCloud(hospitalId=currentHospitalId){
  if(!hospitalId)return null;
  try{
    const {data,error}=await supabaseClient.rpc('get_my_app_state',{
      p_hospital_id: String(hospitalId)
    });
    if(error)throw error;
    if(data){
      const normalized=normalizeDB(data);
      if(normalized&&Array.isArray(normalized.wards))return normalized;
    }
    console.warn('RPC اطلاعات معتبری برنگرداند.');
  }catch(e){
    console.error('خطا در دریافت اطلاعات با RPC:',e);
  }
  return null;
}

function _divJ(a,b){return Math.trunc(a/b);}
function _jalCalJ(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];const bl=breaks.length,gy=jy+621;let leapJ=-14,jp=breaks[0],jm=0,jump=0,i=1;if(jy<jp||jy>=breaks[bl-1])throw new Error('سال جلالی خارج از محدوده پشتیبانی‌شده: '+jy);for(;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=_divJ(jump,33)*8+_divJ(jump%33,4);jp=jm;}let n=jy-jp;leapJ+=_divJ(n,33)*8+_divJ((n%33)+3,4);if((jump%33)===4&&jump-n===4)leapJ++;const leapG=_divJ(gy,4)-_divJ((_divJ(gy,100)+1)*3,4)-150;const march=20+leapJ-leapG;if(jump-n<6)n=n-jump+_divJ(jump+4,33)*33;let leap=(((n+1)%33)-1)%4;if(leap===-1)leap=4;return {leap,gy,march};}

function _j2dJ(jy,jm,jd){const r=_jalCalJ(jy);return _g2dJ(r.gy,3,r.march)+(jm-1)*31-_divJ(jm,7)*(jm-7)+jd-1;}
function jalaliWeekday(jy,jm,jd){const jdn=_j2dJ(jy,jm,jd);const d=new Date((jdn-2440588)*86400000);return ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][d.getUTCDay()];}

 for(let d=1;d<=len;d++){

   SHIFTS.forEach(t=>{if((day[t]||[]).map(String).includes(String(n.id)))work+=workHoursFor(t,hol,s.settings)});
   if(String(day.headNurse??'')===String(n.id))work+=num(s.settings.morningHours);
 }
 const leave=leaveDays(w,n.id,k)*num(s.settings.leaveHours);
 const mm=w.monthly?.[k]||{};
 const target=mm.quota?.[n.id]!==undefined?num(mm.quota[n.id]):(mm.defaultQuota!==undefined?num(mm.defaultQuota):num(md.quotaOverrides?.[n.id]??md.quotaDefault));

}
function constraintSummary(n){
 const c=n.monthlyConstraints||{},sr=c.shiftRules||{};
 const cannot=Array.isArray(sr.cannot)?sr.cannot:[];
 const minMax=sr.minMax||{};
 const consecutive=sr.consecutive||{};
 return {cannot,minMax,consecutive,overtimeRequestHours:num(c.overtimeRequestHours||c.hours?.overtimeRequestHours),raw:c};
}

function shiftCapacity(w,t){
 const c=w.capacity||{};
 const map={
  morning:{min:num(c.minMorning),max:num(c.maxMorning)},
  evening:{min:num(c.minEvening),max:num(c.maxEvening)},
  night:{min:num(c.minNight),max:num(c.maxNight)}
 };
 return map[t]||{min:0,max:0};
}
function coverageAudit(w,k){
 const out=[],s=w.scheduleState;
 if(!s||!s.months||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 for(let d=1;d<=len;d++){
  const day=md.schedule?.[d]||{};
  SHIFTS.forEach(t=>{
   const cap=shiftCapacity(w,t),count=(day[t]||[]).length;
   if(cap.min>0&&count<cap.min)
    out.push({level:'critical',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} فقط ${fa(count)} نفر دارد؛ حداقل مجاز ${fa(cap.min)} نفر است.`});
   if(cap.max>0&&count>cap.max)
    out.push({level:'warning',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} دارای ${fa(count)} نفر است؛ حداکثر مجاز ${fa(cap.max)} نفر است.`});
  });
 }
 return out;
}

function advancedAudit(w,k){
 const out=[],s=w.scheduleState;if(!s||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 // تعارض‌های آشکار روزانه
 for(let d=1;d<=len;d++){
   const seen={};const day=md.schedule[d]||{};
   SHIFTS.forEach(t=>(day[t]||[]).forEach(id=>{
     const z=String(id);seen[z]=(seen[z]||[]).concat(t);
   }));
   Object.entries(seen).forEach(([id,a])=>{
     if(a.length>2)out.push({level:'critical',text:`روز ${fa(d)}: ${nameOf(w,id)} بیش از دو شیفت دارد.`});
     if(a.includes('evening')&&a.includes('night'))out.push({level:'warning',text:`روز ${fa(d)}: ${nameOf(w,id)} همزمان عصر و شب ثبت شده است.`});
   });
 }
 // محدودیت‌های فردی موجود در فایل اصلی
 w.nurses.forEach(n=>{
   const c=constraintSummary(n),sr=c.raw.shiftRules||{};
   SHIFTS.forEach(t=>{
     const arr=sr.cannot||[];
     if(arr.includes(t)){
       for(let d=1;d<=len;d++)if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id)))
         out.push({level:'critical',text:`${n.name}: شیفت ${SHIFT_LABEL[t]} در محدودیت فردی ممنوع شده ولی ثبت شده است.`});
     }
     const mm=sr.minMax?.[t]||{},cnt=countShift(w,n.id,k)[t];
     if(num(mm.max)>0&&cnt>num(mm.max))out.push({level:'warning',text:`${n.name}: تعداد شیفت ${SHIFT_LABEL[t]} از حداکثر ${fa(mm.max)} بیشتر است.`});
     if(num(mm.min)>0&&cnt<num(mm.min))out.push({level:'warning',text:`${n.name}: حداقل ${fa(mm.min)} شیفت ${SHIFT_LABEL[t]} خواسته شده اما ${fa(cnt)} ثبت شده است.`});
     const lim=num(sr.consecutive?.[t]);if(lim>0){
       let run=0;
       for(let d=1;d<=len;d++){
         if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id))){run++;if(run>lim){out.push({level:'warning',text:`${n.name}: توالی شیفت ${SHIFT_LABEL[t]} از حد ${fa(lim)} بیشتر شده است.`});break}}
         else run=0;
       }
     }
   });
   const cannotDays=c.raw.cannotDays||c.raw.days?.cannot||[];
   if(Array.isArray(cannotDays))cannotDays.forEach(d=>{
     if((md.schedule[d]?.morning||[]).map(String).includes(String(n.id))||(md.schedule[d]?.evening||[]).map(String).includes(String(n.id))||(md.schedule[d]?.night||[]).map(String).includes(String(n.id)))
       out.push({level:'critical',text:`${n.name}: در روز ${fa(d)} محدودیت عدم حضور ثبت شده ولی شیفت دارد.`});
   });
 });
 return out.slice(0,100);
}

function wardKpi(w,k){

 const md=w.scheduleState?.months?.[k]||{};
 let shifts=0;
 Object.values(md.schedule||{}).forEach(d=>SHIFTS.forEach(t=>shifts+=(d[t]||[]).length));
 const cap=w.capacity||{};

 const minNeed=(cap.minMorning||0)*days+(cap.minEvening||0)*days+(cap.minNight||0)*days;

 const coveragePct=minNeed?Math.min(100,Math.round(shifts/minNeed*100)):null;

}

function metroEngine(){
 const results=[];

 // مرحله ۱ «مغز تصمیم‌گیر»: ابتدا کمبود واقعی هر شیفت/روز را پیدا می‌کنیم.
 db.wards.forEach(w=>monthKeys(w).forEach(k=>{
  const md=w.scheduleState?.months?.[k]; if(!md)return;
  const cap=w.capacity||{}, [y,m]=k.split('-').map(Number),len=monthLen(y,m);

  SHIFTS.forEach(sh=>{
   const key=sh==='morning'?'minMorning':sh==='evening'?'minEvening':'minNight';
   const min=Number(cap[key]||0); if(!min)return;

   let shortage=0, days=[];
   for(let d=1;d<=len;d++){
    const assigned=(md.schedule?.[d]?.[sh]||[]).map(String);
    const missing=Math.max(0,min-assigned.length);
    if(missing){
      shortage+=missing;
      days.push({day:d,missing,assigned});
    }
   }
   if(shortage)results.push({ward:w,month:k,shift:sh,shiftLabel:SHIFT_LABEL[sh],shortage,days});
  });
 }));

 // کاندیدها: فعال، خارج از بخش مقصد، و ترجیحاً بدون شیفت همزمان.
 function candidateScore(n,w,k,sh,days){
  let score=100, reasons=[];
  const md=w.scheduleState?.months?.[k];
  if(!md)return {score:0,reasons:['برنامه ماه موجود نیست']};

  let conflicts=0, assignedCount=0;
  days.forEach(x=>{
   const ids=(md.schedule?.[x.day]?.[sh]||[]).map(String);
   if(ids.includes(String(n.id)))conflicts++;
   SHIFTS.forEach(t=>{
    if((md.schedule?.[x.day]?.[t]||[]).map(String).includes(String(n.id)))assignedCount++;
   });
  });

  if(conflicts){
   score-=70;
   reasons.push('در یکی از روزهای کسری، همین شیفت را دارد');
  } else {
   reasons.push('تعارض مستقیم با شیفت هدف پیدا نشد');
  }

  if(assignedCount===0){
   score+=15;
   reasons.push('در روزهای کسری شیفت ثبت‌شده‌ای ندارد');
  } else if(assignedCount<=2){
   score+=5;
   reasons.push('تعداد شیفت‌های ثبت‌شده در روزهای کسری کم است');
  } else {
   score-=10;
   reasons.push('در روزهای کسری چند شیفت ثبت‌شده دارد');
  }

  // اگر اطلاعات موظفی/کارکرد در سیستم موجود باشد، از آن فقط به‌عنوان سیگنال کمکی استفاده می‌کنیم.
  try{
   const c=calcPerson(w,n,k);
   if(c && Number(c.diff)>0){
    score+=10;
    reasons.push('در محاسبه کارکرد ماه، ظرفیت اضافه‌کار/مازاد دارد');
   } else if(c && Number(c.diff)<0){
    score-=5;
    reasons.push('در محاسبه کارکرد ماه کسری دارد');
   }
  }catch(_){}

  return {score,reasons};
 }

 const suggestions=results.map(r=>{
  const candidates=[];

  db.wards.filter(w=>w.id!==r.ward.id).forEach(w=>{
   (w.nurses||[]).filter(n=>n.active!==false).forEach(n=>{
    const s=candidateScore(n,w,r.month,r.shift,r.days);
    candidates.push({
      id:String(n.id),
      name:n.name||'بدون نام',
      ward:w.name||'بخش نامشخص',
      score:s.score,
      reasons:s.reasons
    });
   });
  });

  candidates.sort((a,b)=>b.score-a.score);

  const top=candidates.slice(0,8);
  const candidateHtml=top.map((c,i)=>{
    const badge=c.score>=110?'پیشنهاد اولیه':c.score>=90?'قابل بررسی':'نیازمند بررسی';
    const key=`${r.ward.id}|${r.month}|${r.shift}|${c.id}`;
    const past=(db.aiLearning||[]).filter(x=>x.key===key);
    const accepted=past.filter(x=>x.decision==='accepted').length;
    const rejected=past.filter(x=>x.decision==='rejected').length;
    return `<div class="notice" style="margin:4px 0">
      <b>${fa(i+1)}. ${esc(c.name)}</b> — ${esc(c.ward)}
      <span class="muted"> | ${badge} | امتیاز داخلی: ${fa(Math.max(0,c.score))}</span>
      ${past.length?`<span class="muted"> | سابقه: تأیید ${fa(accepted)} / رد ${fa(rejected)}</span>`:''}
      <div class="muted">${esc(c.reasons.join('؛ '))}</div>
      <div class="actions">
       <button type="button" class="btn ok small" data-ai-feedback="accepted" data-ai-key="${esc(key)}" data-ai-name="${esc(c.name)}">✓ تأیید پیشنهاد</button>
       <button type="button" class="btn bad small" data-ai-feedback="rejected" data-ai-key="${esc(key)}" data-ai-name="${esc(c.name)}">✕ رد پیشنهاد</button>
      </div>
    </div>`;
  }).join('') || 'نیروی کاندید ثبت نشده';

  const first=top[0];
  const decision=first
    ? `بررسی اولیه ${first.name} از ${first.ward}`
    : 'کاندید مناسبی برای بررسی اولیه پیدا نشد';

  return `<tr>
    <td>${esc(r.ward.name)}</td>
    <td>${monthTitle(r.month)}</td>
    <td>${esc(r.shiftLabel)}</td>
    <td>${fa(r.shortage)}</td>
    <td>${esc(r.days.map(x=>x.day).join('، '))}</td>
    <td>${candidateHtml}<div class="notice ok"><b>اقدام پیشنهادی:</b> ${esc(decision)} — تأیید نهایی فقط با مترون.</div></td>
  </tr>`;
 }).join('');

 const learn=db.aiLearning||[];
 const acceptedLearn=learn.filter(x=>x.decision==='accepted').length;
 const rejectedLearn=learn.filter(x=>x.decision==='rejected').length;
 const feedbackPanel=`<div class="card"><div class="title">📚 یادگیری از تصمیم‌های مترون</div>
   <div class="notice">هر بار که مترون یک پیشنهاد را تأیید یا رد کند، نتیجه فقط به‌عنوان سابقه تصمیم ثبت می‌شود. این داده‌ها فعلاً برای نمایش سابقه و آماده‌سازی مرحله یادگیری استفاده می‌شوند.</div>
   <div class="statgrid"><div class="stat"><b>${fa(acceptedLearn)}</b><span>پیشنهاد تأییدشده</span></div><div class="stat"><b>${fa(rejectedLearn)}</b><span>پیشنهاد ردشده</span></div><div class="stat"><b>${fa(learn.length)}</b><span>کل بازخوردها</span></div></div></div>`;
 return feedbackPanel+`<div class="card">
   <div class="title">🧠 موتور تصمیم‌یار مترون — مرحله ۲</div>
   <div class="notice">
     این موتور ابتدا کمبود را بر اساس حداقل نیروی تعریف‌شده شناسایی می‌کند،

function scheduleModule(){
 const w=currentWard();if(!w.scheduleState)return `<div class="card"><div class="notice warn">برنامه شیفت این بخش هنوز وارد نشده است.</div><button type="button" class="btn pri" data-action="import">📥 بارگذاری برنامه شیفت این بخش</button></div>`;

 const s=w.scheduleState,md=s.months[k]||{},[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 let rows='';
 for(let d=1;d<=len;d++){
   const day=md.schedule[d]||{},hol=isHoliday(md,y,m,d);

 }

 return `<div class="card">

 </div>`;
}

function cancelTemporaryMission(missionId){
 const mid=String(missionId||''); if(!mid)return;
 if(!confirm('این مأموریت لغو شود؟ در صورت ارسال، از پرتال سرپرستار و برنامه مقصد نیز حذف خواهد شد.'))return;
 const affected=[];
 (db.wards||[]).forEach(w=>{
   (w.staffMovements||[]).forEach(r=>{if(r&&r.type==='temporary'&&String(r.missionId||r.id||'')===mid) affected.push({ward:w,row:r});});
 });
 if(!affected.length)return toast('مأموریت پیدا نشد.');
 // مشخصات رکوردهای مقصد قبل از لغو؛ چون ممکن است یک پرستار برای چند مأموریت متفاوت مشترک باشد.
 const destRows=affected.filter(x=>x.row.sentToPortal===true&&!x.row.cancelled&&x.row.toWardId!=null&&x.row.nurseId!=null);
 // ابتدا خود دستور را لغوشده می‌کنیم؛ سابقه در «لیست همه مأموریت‌ها» باقی می‌ماند.
 (db.wards||[]).forEach(w=>{
   if(Array.isArray(w.staffMovements)) w.staffMovements=w.staffMovements.map(r=>{
     if(r&&r.type==='temporary'&&String(r.missionId||r.id||'')===mid) return {...r,cancelled:true,sentToPortal:false,status:'لغوشده'};
     return r;
   });
   (w.nurses||[]).forEach(n=>{
     if(Array.isArray(n.temporaryAwayMissions)) n.temporaryAwayMissions=n.temporaryAwayMissions.filter(r=>String(r?.missionId||'')!==mid);
     if(Array.isArray(n.temporaryMissions)) n.temporaryMissions=n.temporaryMissions.filter(r=>String(r?.missionId||'')!==mid);
   });
 });
 // در مقصد فقط همان روز/شیفت‌های مأموریت لغوشده حذف می‌شوند؛ مأموریت‌های دیگر همان پرستار دست‌نخورده می‌مانند.
 const destByWard=new Map();
 destRows.forEach(x=>{
   const wid=String(x.row.toWardId), arr=destByWard.get(wid)||[];
   arr.push(x.row); destByWard.set(wid,arr);
 });
 destByWard.forEach((rows,wid)=>{
   const w=db.wards.find(x=>String(x.id)===wid); if(!w)return;
   const removeByKey=new Set(rows.map(r=>`${r.monthKey}|${Number(r.day)}|${String(r.shift||'')}`));
   const nurseIds=new Set(rows.map(r=>String(r.nurseId)));
   if(w.scheduleState?.months){
     Object.entries(w.scheduleState.months).forEach(([mk,md])=>{
       Object.entries(md.schedule||{}).forEach(([day,slot])=>{
         ['morning','evening','night'].forEach(t=>{
           const key=`${mk}|${Number(day)}|${t}`;
           if(!removeByKey.has(key)||!Array.isArray(slot[t]))return;
           slot[t]=slot[t].filter(id=>!nurseIds.has(String(id)));
         });
         if(slot.headNurse!=null && rows.some(r=>String(r.nurseId)===String(slot.headNurse)&&removeByKey.has(`${mk}|${Number(day)}|morning`))) slot.headNurse=null;
       });
     });
   }
   // اگر آن پرستار کمکی دیگر هیچ مأموریت فعالی ندارد، از فهرست مقصد هم حذفش کن.
   if(Array.isArray(w.nurses)) w.nurses=w.nurses.filter(n=>{
     if(!n?.temporarySupport)return true;
     const hasOther=Array.isArray(n.temporaryMissions)&&n.temporaryMissions.length>0;
     return hasOther || !nurseIds.has(String(n.id));
   });
   if(w.scheduleState)w.scheduleState.nurses=w.nurses;
 });
 cleanupTemporarySupportNurses(); saveDB();
 // اگر پرتال مقصد باز است، snapshot تازه را بفرست تا نام و محدودیت مأمور لغوشده فوراً حذف شود.
 const affectedDest=[...new Set(destRows.map(x=>String(x.row.toWardId)))];
 affectedDest.forEach(wid=>{
   if(supervisorFrame&&String(supervisorWardId)===String(wid)){
     const tw=db.wards.find(x=>String(x.id)===String(wid));
     if(tw) try{
       const mergedState=mergeSupervisorStateForWard(tw);
       mergedState.supervisorAssignments=clone(db.hospital?.supervisorAssignments||{});
       mergedState.supervisorWardId=String(tw.id);
       supervisorFrame.contentWindow.postMessage({bridge:'__METRON_SUPERVISOR_BRIDGE__',type:'INIT',state:mergedState},'*');
     }catch(e){console.warn('Temporary mission cancellation sync failed',e);}
   }
 });
 render(); toast('مأموریت لغو شد و در صورت ارسال، از پرتال سرپرستار و برنامه مقصد حذف شد.');
}

function cleanupTemporarySupportNurses(){
 const activeIds=new Set();
 (db.wards||[]).forEach(w=>{
   (w.staffMovements||[]).forEach(r=>{
     if(r&&r.type==='temporary'&&r.sentToPortal===true&&r.cancelled!==true&&r.missionId!=null) activeIds.add(String(r.missionId));
   });
 });
 (db.wards||[]).forEach(w=>{
   if(!Array.isArray(w.nurses))return;
   w.nurses=w.nurses.filter(n=>{
     if(!n?.temporarySupport)return true;
     const mids=Array.isArray(n.temporaryMissions)?n.temporaryMissions.map(r=>String(r?.missionId||'')):[ ];
     return mids.some(id=>id&&activeIds.has(id));
   });
   if(w.scheduleState&&Array.isArray(w.scheduleState.nurses)){
     const keep=new Set(w.nurses.map(n=>String(n.id)));
     w.scheduleState.nurses=w.scheduleState.nurses.filter(n=>!n?.temporarySupport||keep.has(String(n.id)));
   }
 });
}
function sendTemporaryMission(movementId){
 cleanupTemporarySupportNurses();
 const sourceWard=currentWard();
 const first=sourceWard?.staffMovements?.find(r=>r&&r.type==='temporary'&&String(r.missionId||r.id)===String(movementId));
 if(!sourceWard||!first)return toast('رکورد مأموریت پیدا نشد.');
 if(first.cancelled===true)return toast('این مأموریت لغو شده است.');
 if(first.sentToPortal===true)return toast('این مأموریت قبلاً به پرتال سرپرستار ارسال شده است.');
 const missionId=String(first.missionId||'');
 const tw=db.wards.find(x=>String(x.id)===String(first.toWardId));
 const n=sourceWard.nurses.find(x=>String(x.id)===String(first.nurseId));
 if(!tw||!n)return toast('بخش مقصد یا پرستار مبدأ پیدا نشد.');
 const sourceRows=sourceWard.staffMovements.filter(r=>r&&r.type==='temporary'&&String(r.missionId)===missionId&&!r.cancelled);
 if(!sourceRows.length)return toast('جزئیات مأموریت پیدا نشد.');
 const rules=[];
 sourceRows.forEach(r=>{
   const shifts=expandMovementShift(r.shift);
   // «ساعت مأموریت در هر روز» مجموع ساعت همان روز است؛ در شیفت ترکیبی
   // به‌طور مساوی بین شیفت‌های انتخاب‌شده تقسیم می‌شود.
   const ruleHours=(r.hours!=null && shifts.length>1) ? Number(r.hours)/shifts.length : (r.hours??null);
   shifts.forEach(sh=>{
     const rule={missionId,monthKey:r.monthKey,day:Number(r.day),shift:sh,hours:ruleHours,fromWardId:r.fromWardId,fromWardName:r.fromWardName,toWardId:r.toWardId,toWardName:r.toWardName,sourceNurseId:n.id};
     if(!rules.some(x=>x.day===rule.day&&x.shift===rule.shift))rules.push(rule);
     r.sentToPortal=true;r.status='ارسال‌شده به پرتال سرپرستار';
   });
 });
 // فقط رکورد همین مأموریت را در مقصد جایگزین می‌کنیم؛ مأموریت‌های قبلاً
 // ارسال‌شده و متفاوت این پرستار باید حفظ شوند.
 tw.staffMovements=Array.isArray(tw.staffMovements)?tw.staffMovements:[];
 tw.staffMovements=tw.staffMovements.filter(r=>!(r&&r.type==='temporary'&&String(r.missionId||'')===missionId));
 let dest=tw.nurses.find(x=>x.temporarySupport&&((n.globalPersonnelId&&String(x.globalPersonnelId)===String(n.globalPersonnelId))||String(x.temporarySourceNurseId||'')===String(n.id)));
 if(!dest){
   dest=clone(n);dest.id=uid();
   tw.nurses.push(dest);
 }
 dest.temporarySupport=true;dest.temporarySourceNurseId=n.id;dest.temporarySourceWardId=sourceWard.id;
 const previousMissions=Array.isArray(dest.temporaryMissions)?dest.temporaryMissions:[];
 dest.temporaryMissions=previousMissions.filter(r=>String(r?.missionId||'')!==missionId).concat(rules);
 n.temporaryAwayMissions=Array.isArray(n.temporaryAwayMissions)?n.temporaryAwayMissions.filter(r=>String(r.missionId)!==missionId):[];
 // فقط همین دستور در مبدأ قفل می‌شود.
 n.temporaryAwayMissions.push(...rules.map(r=>({...r,missionId})));
 // مقصد فقط رکوردهای ارسال‌شده را دریافت می‌کند.
 sourceRows.forEach(r=>tw.staffMovements.push({...r,id:uid(),nurseId:dest.id,status:'دریافت‌شده در پرتال سرپرستار',sentToPortal:true,sourceNurseId:n.id}));
 tw.scheduleState=tw.scheduleState||normalizeSchedule({nurses:tw.nurses,settings:DEF,months:{}});
 tw.scheduleState.nurses=tw.nurses;
 logActivity('temporary-support-sent',{fromWard:sourceWard.name,toWard:tw.name,nurse:n.name,missionId,monthKey:first.monthKey,days:sourceRows.map(r=>r.day),shift:first.shift});
 saveDB();
 // اگر پرتال مقصد همین الان باز است، بلافاصله snapshot جدید را بفرست.
 if(supervisorFrame&&String(supervisorWardId)===String(tw.id)){
   try{
     const mergedState=mergeSupervisorStateForWard(tw);
     mergedState.supervisorAssignments=clone(db.hospital?.supervisorAssignments||{});
     mergedState.supervisorWardId=String(tw.id);
     supervisorFrame.contentWindow.postMessage({bridge:'__METRON_SUPERVISOR_BRIDGE__',type:'INIT',state:mergedState},'*');
   }catch(e){console.warn('Temporary mission sync failed',e);}
 }
 render();
 toast(`مأموریت ${n.name} به پرتال ${tw.name} ارسال شد.`);
}

const LOGIN_MEMORY_KEY='metron-login-memory-v2';
function getLoginMemory(){
  try{
    const raw=JSON.parse(localStorage.getItem(LOGIN_MEMORY_KEY)||'{}')||{};
    const clean={};
    Object.keys(raw).forEach(k=>{const x=raw[k]||{};clean[k]={email:String(x.email||''),wardId:String(x.wardId||'')};});
    localStorage.setItem(LOGIN_MEMORY_KEY,JSON.stringify(clean));
    try{localStorage.removeItem('metron-login-memory-v1');}catch(_){}
    return clean;
  }catch(e){return {};}
}
function getSavedLogin(role,hospitalId){const all=getLoginMemory();const key=role+'::'+String(hospitalId||'global');return all[key]||null;}
function saveLoginMemory(role,hospitalId,email,password,wardId){try{const all=getLoginMemory();const key=role+'::'+String(hospitalId||'global');all[key]={email:String(email||''),wardId:String(wardId||'')};localStorage.setItem(LOGIN_MEMORY_KEY,JSON.stringify(all));}catch(e){console.warn('ذخیره ایمیل روی دستگاه انجام نشد',e);}}
function removeLoginMemory(role,hospitalId){try{const all=getLoginMemory();delete all[role+'::'+String(hospitalId||'global')];localStorage.setItem(LOGIN_MEMORY_KEY,JSON.stringify(all));}catch(e){}}
function fillSavedLogin(role){setTimeout(()=>{const saved=getSavedLogin(role,role==='server'?null:currentHospitalId);if(!saved)return;const email=document.getElementById(role==='server'?'serverEmail':'loginEmail');const remember=document.getElementById(role==='server'?'rememberServerLogin':'rememberLogin');if(email)email.value=saved.email||'';if(remember)remember.checked=true;const ward=document.getElementById('loginWard');if(ward&&saved.wardId&&[...ward.options].some(o=>String(o.value)===String(saved.wardId)))ward.value=saved.wardId;},40);}
async function serverLogin(){
 const email=(document.getElementById('serverEmail')?.value||'').trim();
 const password=document.getElementById('serverPass')?.value||'';
 const err=document.getElementById('serverAuthError');
 if(err)err.style.display='none';
 if(!email||!password){if(err){err.textContent='ایمیل و رمز عبور الزامی است.';err.style.display='block';}return;}
 try{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data?.session){throw new Error('نشست کاربر ایجاد نشد.');}
   const {data:check,error:checkError}=await supabaseClient.functions.invoke('server-admin',{body:{action:'authorize'}});
   if(checkError)throw checkError;
   if(!check?.authorized){throw new Error(check?.message||'این حساب مدیر سرور نیست.');}
   if(document.getElementById('rememberServerLogin')?.checked)saveLoginMemory('server',null,email,password);else removeLoginMemory('server',null);
   selectedRole='__server_panel';
   await renderServerPanel();
 }catch(e){
   console.error(e);
   try{await supabaseClient.auth.signOut();}catch(_){}
   if(err){err.textContent='ورود مدیر سرور انجام نشد: '+(e?.message||'خطای نامشخص');err.style.display='block';}
 }
}

   const b=document.getElementById('srvSaveEdit'); if(b){b.disabled=true;b.textContent='در حال ذخیره...';}
   try{
     const settings=Object.assign({},h.settings||{},{year});
     if(metroEmail)settings.metroEmail=metroEmail;
     const {error}=await supabaseClient.from('hospitals').update({name,code,active,settings}).eq('id',id);
     if(error)throw error;
     let passwordChanged=false;
     if(metroPassword){
       const {data:pwdResult,error:pwdError}=await supabaseClient.functions.invoke('server-admin',{body:{action:'update_user_password',hospital_id:String(id),metro_email:metroEmail||currentMetroEmail,password:metroPassword,new_password:metroPassword}});
       if(pwdError){
         let detail='';
         try{
           if(pwdError.context?.response){
             const ct=pwdError.context.response.headers?.get?.('content-type')||'';
             if(ct.includes('application/json')){
               const j=await pwdError.context.response.clone().json();
               detail=j?.message||j?.error||j?.detail||'';
             }else{
               detail=(await pwdError.context.response.clone().text()).trim();
             }
           }
         }catch(_){}
         const base=pwdError.message||'Edge Function خطا داد.';
         throw new Error(detail?`${base} — ${detail}`:base);
       }
       if(!pwdResult?.ok)throw new Error(pwdResult?.message||pwdResult?.error||pwdResult?.detail||'تغییر رمز مترون انجام نشد.');
       passwordChanged=true;
     }
     if(String(currentHospitalId)===String(id)){
       db.hospital=db.hospital||{};db.hospital.name=name;db.hospital.year=year;
       try{localStorage.setItem(KEY+'::hospital::'+id,JSON.stringify(clone(db)));localStorage.setItem(KEY+'::hospital::'+id,JSON.stringify(clone(db)));}catch(e){}
       render();
     }
     closeModal();
     await renderServerPanel();
     toast(passwordChanged?'✅ اطلاعات بیمارستان ذخیره شد و رمز مترون از طریق سرور تغییر کرد.':'✅ اطلاعات بیمارستان ذخیره شد.');
   }catch(e){console.error(e);toast('⚠️ ویرایش انجام نشد: '+(e?.message||'خطای نامشخص'));if(b){b.disabled=false;b.textContent='✓ ذخیره تغییرات';}}
 };
}
async function serverDeleteHospital(id){
 const h=serverHospitals.find(x=>String(x.id)===String(id));if(!h)return;
 const typed=prompt('برای حذف کامل بیمارستان «'+(h.name||'')+'»، نام بیمارستان را دقیقاً وارد کنید:');if(String(typed||'').trim()!==String(h.name||'').trim()){if(typed!==null)toast('⚠️ نام بیمارستان صحیح وارد نشد؛ حذف لغو شد.');return;}
 try{
   // حذف واقعی فقط از طریق RPC امن سمت دیتابیس انجام می‌شود.
   // RPC خودش فعال بودن Server Admin را بررسی می‌کند و ترتیب حذف
   // app_state → hospital_requests → hospitals را رعایت می‌کند.
   const {error}=await supabaseClient.rpc('delete_hospital_data',{
     p_hospital_id:String(id)
   });
   if(error)throw error;

   localStorage.removeItem(KEY+'::hospital::'+id);
   if(String(currentHospitalId)===String(id)){
     currentHospitalId=null;
     localStorage.removeItem('metron-current-hospital-id');
     sessionRole=null;
     selectedRole='__server_panel';
     db=emptyDB();
   }
   await renderServerPanel();
   toast('🗑 بیمارستان و اطلاعات ذخیره‌شده آن حذف شد.');
 }catch(e){
   console.error(e);
   toast('⚠️ حذف انجام نشد: '+(e?.message||'خطای نامشخص'));
 }
}

async function createHospitalUser(){
  const err=document.getElementById('umError');
  if(err)err.style.display='none';
  if(sessionRole!=='metro'){if(err){err.textContent='فقط مترون می‌تواند حساب بسازد.';err.style.display='block';}return;}
  const role=document.getElementById('umRole')?.value||'nurse';
  const wardId=document.getElementById('umWard')?.value||'';
  const nurseId=document.getElementById('umNurse')?.value||'';
  const fullName=(document.getElementById('umFullName')?.value||'').trim();
  const email=(document.getElementById('umEmail')?.value||'').trim().toLowerCase();
  const password=document.getElementById('umPassword')?.value||'';
  if(!wardId){if(err){err.textContent='ابتدا بخش را انتخاب کنید.';err.style.display='block';}return;}
  if(role==='nurse'&&!nurseId){if(err){err.textContent='برای پرستار، یک پرستار را انتخاب کنید.';err.style.display='block';}return;}
  if(!fullName){if(err){err.textContent='نام و نام خانوادگی الزامی است.';err.style.display='block';}return;}
  if(!email||!email.includes('@')){if(err){err.textContent='ایمیل معتبر وارد کنید.';err.style.display='block';}return;}
  if(password.length<8){if(err){err.textContent='رمز عبور باید حداقل ۸ کاراکتر باشد.';err.style.display='block';}return;}
  try{
    const {data:sessionData}=await supabaseClient.auth.getSession();
    const accessToken=sessionData?.session?.access_token;
    if(!accessToken)throw new Error('نشست مترون معتبر نیست. دوباره وارد شوید.');
    const {data,error}=await supabaseClient.functions.invoke('server-admin',{
      body:{
        action:'create_user',
        hospital_id:String(currentHospitalId),
        role,
        ward_id:String(wardId),
        nurse_id:role==='nurse'?String(nurseId):null,
        email,
        password,
        full_name:fullName
      }
    });
    if(error)throw error;
    if(!data?.ok)throw new Error(data?.message||data?.error||'ساخت حساب انجام نشد.');
    toast('✅ حساب کاربری با موفقیت ساخته شد.');
    const roleEl=document.getElementById('umRole'),wardEl=document.getElementById('umWard');
    const selectedWard=wardEl?.value||wardId;
    document.getElementById('umFullName').value='';
    document.getElementById('umEmail').value='';
    document.getElementById('umPassword').value='';
    if(roleEl)roleEl.value='nurse';
    if(wardEl)wardEl.value=selectedWard;
    window.__umRoleChanged();
    window.__umWardChanged();
  }catch(e){
    console.error(e);
    if(err){err.textContent='ساخت حساب انجام نشد: '+(e?.message||'خطای نامشخص');err.style.display='block';}
  }
}

function importNurseRequestFor(id){
 const w=currentWard(), nurses=w?.nurses||[]; if(!w)return;
 const target=nurses.find(x=>String(x.id)===String(id));
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{
   const p=JSON.parse(await file.text()); if(p.__app!=='درخواست و محدودیت پرستار' || !p.data)throw new Error('bad');
   const pgid=String(p.nurse?.globalPersonnelId||'').trim(), pname=proposalNormalizeName(p.nurse?.name), pward=proposalNormalizeName(p.nurse?.wardName);
   // این فایل از داخل «پرونده همان پرستار» بارگذاری می‌شود؛ بنابراین پرستار انتخاب‌شده مرجع قطعی است.
   // requestKey ممکن است بین نسخه‌های مختلف برنامه یا بعد از انتقال/بازیابی داده تغییر کرده باشد و نباید مانع ورود فایل شود.
   let n=target;
   if(!n){
     const candidates=nurses.filter(x=>
       (p.requestKey&&x.requestKey&&p.requestKey===x.requestKey) ||
       (pgid&&String(x.globalPersonnelId||'').trim()===pgid) ||
       (pname&&proposalNormalizeName(x.name)===pname)
     );
     if(candidates.length===1)n=candidates[0];
   }
   if(!n){toast('⚠️ پرستار مقصد برای بارگذاری مشخص نیست. ابتدا از پرونده همان پرستار روی «بارگذاری فایل درخواست‌ها» بزنید.');return;}
   n.requestProposals=n.requestProposals&&typeof n.requestProposals==='object'?n.requestProposals:{};
   const incoming=clone(p.data.monthlyConstraints||{}), prefs=clone(p.data.preferences||{}), soft=clone(p.data.softPreferences||{});
   const directory=Array.isArray(p.peopleDirectory)?p.peopleDirectory:[];
   const mapPersonId=(rawId)=>{const info=directory.find(x=>Number(x.id)===Number(rawId));if(!info)return Number(rawId);const gid=String(info.globalPersonnelId||'').trim(),nm=proposalNormalizeName(info.name||'');const dest=(gid&&nurses.find(x=>String(x.globalPersonnelId||'').trim()===gid))||(nm&&nurses.find(x=>proposalNormalizeName(x.name||'')===nm));return dest?Number(dest.id):Number(rawId);};
   Object.keys(incoming).forEach(k=>{const c=normalizeProposalMonth(incoming[k]);['noWith'].forEach(key=>{if(Array.isArray(c[key]))c[key]=c[key].map(mapPersonId);});['noWith','preferNoWith','mustWith','preferWith'].forEach(key=>{if(Array.isArray(c.people[key]))c.people[key]=c.people[key].map(mapPersonId);});c.noWith=c.people.noWith.slice();incoming[k]=c;});
   const months=[...new Set([...proposalKeys(incoming),...proposalKeys(prefs),...proposalKeys(soft)])];
   if(!months.length)months=[`${Number((db.hospital?.year||'1405').toString().match(/\d+/)?.[0]||1405)}-1`];
   months.forEach(k=>{n.requestProposals[k]={id:uid(),importedAt:new Date().toISOString(),sourceFile:file.name,requestKey:p.requestKey||'',nurse:clone(p.nurse||{}),data:{preferences:{[k]:prefs[k]||{}},softPreferences:{[k]:soft[k]||{}},monthlyConstraints:{[k]:incoming[k]||{}},note:String(p.data.note||'')},approved:{}};});
   saveDB();ui.proposalNurseId=n.id;ui.proposalMonthKey=months[0];openRequestProposalPanel(w.id);toast('فایل وارد شد؛ همه بخش‌های درخواست و محدودیت‌های فردی برای بررسی نمایش داده می‌شوند.');
 }catch(e){console.error(e);toast('فایل معتبر درخواست و محدودیت پرستار انتخاب نشده است.');}};input.click();
}

async function authLogin(role){

   if(!email){authError('ایمیل حساب مترون الزامی است.');return;}
   try{
     const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
     if(error)throw error;
     const user=data?.user;
     if(!user)throw new Error('حساب کاربری مترون پیدا نشد.');
     const {data:membership,error:memError}=await supabaseClient
       .from('hospital_users')

     const cloud=await loadDBFromCloud(currentHospitalId);

       throw new Error('اطلاعات بیمارستان با حساب شما قابل دریافت نشد. اتصال، عضویت بیمارستان و RPC را بررسی کنید.');
     }
     db=cloud;db.hospital=db.hospital||{};
     const h=hospitals.find(x=>String(x.id)===String(currentHospitalId));

     try{localStorage.setItem(KEY+'::hospital::'+currentHospitalId,JSON.stringify(clone(db)));}catch(e){}

   const email=(document.getElementById('loginEmail')?.value||'').trim();

     if(memError)throw memError;
     if(!membership)throw new Error('این حساب سرپرستار به بیمارستان انتخاب‌شده دسترسی ندارد.');
     if(String(membership.ward_id||'')!==String(wid))throw new Error('این حساب سرپرستار به بخش انتخاب‌شده دسترسی ندارد.');

let passwordRecoveryMode=false;
let recoveryTarget='server';

function passwordRecoveryPage(){
  const label=recoveryTarget==='server'?'مدیر سرور':(recoveryTarget==='metro'?'مترون':(recoveryTarget==='supervisor'?'سرپرستار':'پرستار'));
  return `<div class="auth-shell"><div class="auth-card login-card"><div class="auth-logo">🔐</div><div class="auth-title">تغییر رمز عبور</div><div class="auth-sub">رمز جدید ${label} را وارد کنید.</div><div class="login-fields"><label>رمز جدید</label><input id="recoveryPass1" type="password" autocomplete="new-password" placeholder="حداقل ۶ کاراکتر"><label>تکرار رمز جدید</label><input id="recoveryPass2" type="password" autocomplete="new-password" placeholder="تکرار رمز جدید"></div><button type="button" class="btn pri auth-login" onclick="window.__updateRecoveryPassword()">ذخیره رمز جدید</button><div id="recoveryError" class="notice bad" style="display:none;margin-top:12px"></div><div id="recoveryOk" class="notice good" style="display:none;margin-top:12px"></div></div></div>`;
}

window.__sendRoleRecovery=async function(role){
  recoveryTarget=role||'server';
  const email=(document.getElementById('loginEmail')?.value||'').trim();
  const err=document.getElementById('authError');
  if(err)err.style.display='none';
  if(!email){if(err){err.textContent='ابتدا ایمیل حساب را وارد کنید.';err.style.display='block';}return;}
  try{
    const redirectTo=window.location.origin+window.location.pathname;
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    if(err){err.className='notice good';err.textContent='ایمیل بازیابی رمز ارسال شد. لینک داخل ایمیل را باز کنید.';err.style.display='block';}
  }catch(e){
    if(err){err.className='notice bad';err.textContent='ارسال ایمیل بازیابی انجام نشد: '+(e?.message||'خطای نامشخص');err.style.display='block';}
  }
};
window.__sendRecovery=async function(){
  recoveryTarget='server';
  const email=(document.getElementById('serverEmail')?.value||'').trim();
  const err=document.getElementById('serverAuthError');
  if(err)err.style.display='none';
  if(!email){if(err){err.textContent='ابتدا ایمیل مدیر سرور را وارد کنید.';err.style.display='block';}return;}
  try{
    const redirectTo=window.location.origin+window.location.pathname;
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    if(err){err.className='notice good';err.textContent='ایمیل بازیابی رمز ارسال شد. لینک داخل ایمیل را باز کنید.';err.style.display='block';}
  }catch(e){
    if(err){err.className='notice bad';err.textContent='ارسال ایمیل بازیابی انجام نشد: '+(e?.message||'خطای نامشخص');err.style.display='block';}
  }
};

window.__updateRecoveryPassword=async function(){
  const p1=document.getElementById('recoveryPass1')?.value||'';
  const p2=document.getElementById('recoveryPass2')?.value||'';
  const err=document.getElementById('recoveryError');
  const ok=document.getElementById('recoveryOk');
  if(err)err.style.display='none'; if(ok)ok.style.display='none';
  if(p1.length<6){if(err){err.textContent='رمز جدید باید حداقل ۶ کاراکتر باشد.';err.style.display='block';}return;}
  if(p1!==p2){if(err){err.textContent='تکرار رمز با رمز جدید یکسان نیست.';err.style.display='block';}return;}
  try{
    const {data,error}=await supabaseClient.auth.updateUser({password:p1});
    if(error)throw error;
    passwordRecoveryMode=false;
    selectedRole=recoveryTarget==='server'?'__server':null;
    if(ok){ok.textContent='رمز عبور با موفقیت تغییر کرد. اکنون با رمز جدید وارد شوید.';ok.style.display='block';}
    try{await supabaseClient.auth.signOut();}catch(_){ }
    setTimeout(()=>{render();},700);
  }catch(e){
    if(err){err.textContent='تغییر رمز انجام نشد: '+(e?.message||'خطای نامشخص');err.style.display='block';}
  }
};

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    passwordRecoveryMode=true;
    selectedRole='__recovery';
    render();
  }
  if(event==='SIGNED_OUT' && passwordRecoveryMode){
    passwordRecoveryMode=false;
    selectedRole='__server';
    render();
  }
});

(async function start(){
  initDefaultMonth(); hospitalGateReady=false; render();
  try{
    await loadHospitals();
    if(currentHospitalId&&hospitals.some(h=>String(h.id)===String(currentHospitalId))){
      const h=hospitals.find(x=>String(x.id)===String(currentHospitalId)); db=emptyDB();db.hospital.name=h.name;
      const localKey=KEY+'::hospital::'+currentHospitalId;
      try{const raw=localStorage.getItem(localKey);const x=raw?normalizeDB(JSON.parse(raw)):null;if(x&&Array.isArray(x.wards))db=x;}catch(e){}
      render();
      const cloudData=await Promise.race([loadDBFromCloud(currentHospitalId),new Promise(resolve=>setTimeout(()=>resolve(null),4000))]);
      if(cloudData&&Array.isArray(cloudData.wards)){db=cloudData;db.hospital=db.hospital||{};db.hospital.name=h.name;try{localStorage.setItem(localKey,JSON.stringify(clone(db)));currentHospitalId?localStorage.setItem(KEY+'::hospital::'+currentHospitalId,JSON.stringify(clone(db))):null;}catch(e){}render();}
    }else{currentHospitalId=null;localStorage.removeItem('metron-current-hospital-id');render();}
  }catch(e){console.warn('راه‌اندازی اولیه انجام نشد:',e);hospitalGateReady=true;render();}
})();;

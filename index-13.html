<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08161a">
<title>سامانه مدیریت مترون بیمارستان — نسخه ۱۰</title>
<style>
:root{
 --bg:#071114;--panel:#0d1c20;--panel2:#11262b;--line:#29434a;
 --text:#eef8f7;--muted:#91a7aa;--pri:#36c7c1;--ok:#55d58f;
 --bad:#ff6b6b;--warn:#efc56c;--shadow:0 12px 32px #0005
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
header{position:sticky;top:0;z-index:50;background:#09181cdd;backdrop-filter:blur(10px);border-bottom:1px solid #214047}
.head{max-width:1500px;margin:auto;padding:13px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px}.sub{color:var(--muted);font-size:10px;margin-top:4px}.grow{flex:1}
main{max-width:1500px;margin:auto;padding:12px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.btn{appearance:none;border:1px solid #345159;background:#12262c;color:#e4f8f6;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer;min-height:40px}
.btn:active{transform:translateY(1px)}.btn.pri{background:#146c70;border-color:#49d6cf}.btn.ok{background:#155f40;border-color:#55d58f}
.btn.bad{background:#63252c;border-color:#ff6b6b}.btn.warn{background:#5b4619;border-color:#efc56c}
.btn.active{background:#146c70;border-color:#49d6cf}
.btn.small{padding:7px 9px;min-height:34px;font-size:10px}
.card{background:linear-gradient(145deg,#102024,#0b181c);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:10px}
.title{font-size:16px;font-weight:900;margin-bottom:10px}
.notice{padding:11px;border-radius:11px;background:#102a2f;border:1px solid #31545b;font-size:11px;line-height:1.9;margin:8px 0}
.notice.warn{background:#302719;border-color:#735b2a}.notice.bad{background:#321d22;border-color:#71353b}.notice.ok{background:#102a20;border-color:#356e50}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
label{display:block;font-size:11px;font-weight:800;margin:6px 0}
input,select,textarea{width:100%;background:#09171b;color:var(--text);border:1px solid #2b464d;border-radius:9px;padding:9px;font-size:12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tabs{display:flex;gap:7px;overflow-x:auto;overflow-y:visible;padding:3px 1px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.tabs .btn{flex:0 0 auto}
.tablewrap{overflow:auto;border:1px solid #263e44;border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:10.5px;min-width:640px}
th,td{border:1px solid #263e44;padding:7px;text-align:center;vertical-align:middle}
th{background:#14292e;color:#d8efed;font-weight:900}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17373b}
.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}
.progress{height:8px;background:#17272b;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pri)}
.wardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.wardcard{cursor:pointer;transition:.12s}.wardcard:hover{transform:translateY(-1px);border-color:#46737a}
.wardhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.module-btn{min-height:58px;text-align:right}
.module-btn b{display:block;font-size:11px}.module-btn span{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.stat{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.stat b{font-size:20px;display:block}.stat span{font-size:9px;color:var(--muted)}
.shiftcell{padding:5px;border-radius:8px;margin:2px 0;background:#173034}
.shiftcell.m{background:#3b2d1a}.shiftcell.e{background:#3b231d}.shiftcell.n{background:#242840}
.person-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.person{padding:10px;border:1px solid #29434a;border-radius:11px;background:#0b1b1f}
.modalbg{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:#0e1d21;border:1px solid #3b5b63;border-radius:16px;width:min(920px,100%);max-height:92vh;overflow:auto;padding:15px}
.modal h2{font-size:15px;margin:0 0 10px}.close{float:left}
footer{text-align:center;color:#657c80;padding:24px;font-size:10px}
hr{border:0;border-top:1px solid #263e44;margin:13px 0}
@media(max-width:700px){
 .head{padding:10px}.brand{font-size:15px}.sub{font-size:9px}
 main{padding:8px}.card{padding:11px}.grid{grid-template-columns:1fr 1fr}
 .module-grid{grid-template-columns:1fr 1fr}.module-btn{min-height:64px}
 .wardgrid{grid-template-columns:1fr}.btn{min-height:42px}
}
</style>
<style id="supervisor-integration-v14">
.supervisor-modal{position:fixed;inset:0;z-index:99999;background:#071114;display:flex;flex-direction:column;}
.supervisor-top{height:54px;min-height:54px;background:#0b1b20;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;box-sizing:border-box;border-bottom:1px solid rgba(255,255,255,.12)}
.supervisor-title{font-weight:900;font-size:14px;margin-inline-start:auto;}
.supervisor-frame{width:100%;height:calc(100vh - 54px);border:0;background:#f3f5f7;display:block;}
@media(max-width:600px){.supervisor-top{height:50px;min-height:50px}.supervisor-frame{height:calc(100vh - 50px)}.supervisor-title{font-size:12px}.supervisor-top .btn{font-size:11px;padding:7px 9px}}
</style>
<style id="proposal-css">
.proposal-section{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)}
.proposal-section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.proposal-body{line-height:1.9;font-size:12px;margin-bottom:8px}
</style>
</head>

let supervisorWardId=null,supervisorFrame=null,supervisorStateKey=null;
function supervisorSourceForWard(wid){
 const safe=String(wid).replace(/[^a-zA-Z0-9_-]/g,'_');
 const stateKey='metron-supervisor-state-'+safe;
 return SUPERVISOR_SOURCE.replace(/__METRON_STATE_KEY__/g,stateKey).replace(/__METRON_HISTORY_KEY__/g,stateKey+'-history');
}
function openSupervisor(wid){
 const w=db.wards.find(x=>x.id===wid); if(!w)return;
 supervisorWardId=wid;
 const html=supervisorSourceForWard(wid);
 const m=html.match(/const STORAGE_KEY = '([^']+)'/); supervisorStateKey=m?m[1]:null;
 const f=document.createElement('iframe');
 f.id='supervisorFrame'; f.className='supervisor-frame'; f.title='نرم‌افزار سرپرستار';
 const root=document.createElement('div'); root.className='supervisor-modal'; root.id='supervisorModal';
 root.innerHTML='<div class="supervisor-top"><button type="button" class="btn bad" id="closeSupervisor">🚪 خروج از نقش سرپرستار</button><button type="button" class="btn pri" id="openRequestProposals">📥 درخواست و محدودیت پیشنهادی</button><div class="supervisor-title">نرم‌افزار سرپرستار — '+esc(w.name)+'</div></div>';
 root.appendChild(f); document.body.appendChild(root); supervisorFrame=f;
 document.getElementById('closeSupervisor').onclick=closeSupervisor; document.getElementById('openRequestProposals').onclick=()=>openRequestProposalPanel(wid);
 const init=()=>{
   try{
     const state=JSON.stringify(w.scheduleState||{});
     f.contentWindow.localStorage.setItem(supervisorStateKey,state);
     f.contentWindow.postMessage({bridge:'__METRON_SUPERVISOR_BRIDGE__',type:'INIT',state:w.scheduleState||{}},'*');
   }catch(e){console.error('Supervisor init failed',e)}
 };
 f.addEventListener('load',init,{once:false});
 // srcdoc is reliable on Android and keeps the original supervisor app intact.
 f.srcdoc=html;
}


function proposalNormalizeName(x){return String(x||'').trim().replace(/\s+/g,' ').replace(/[يى]/g,'ی').replace(/ك/g,'ک');}
function proposalKeys(data){return Object.keys(data||{}).filter(k=>/^\d+-([1-9]|1[0-2])$/.test(k)).sort((a,b)=>{const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return ay-by||am-bm;});}
function proposalMonthLabel(k){const [y,m]=k.split('-').map(Number);return (MONTHS[m-1]||m)+' '+fa(y);}
function ensureProposalStore(n){n.requestProposals=n.requestProposals&&typeof n.requestProposals==='object'?n.requestProposals:{};return n.requestProposals;}
async function openRequestProposalPanel(wid){
 const old=document.getElementById('requestProposalPanel');if(old)old.remove();
 // همیشه آخرین اطلاعات را از Supabase می‌گیریم تا درخواست تازه پرستار بدون فایل برای سرپرستار ظاهر شود.
 try{
   const cloudData=await loadDBFromCloud();
   if(cloudData&&Array.isArray(cloudData.wards)){
     db=cloudData;
     try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
   }
 }catch(e){console.warn('Cloud refresh for nurse requests failed:',e);}
 const w=db.wards.find(x=>String(x.id)===String(wid)); if(!w)return;
 const root=document.createElement('div');root.id='requestProposalPanel';root.className='supervisor-modal';
 root.style.zIndex='99999';
 document.body.appendChild(root);
 renderRequestProposalPanel(wid);
}
function proposalValueText(v,w){
 if(v===null||v===undefined||v==='')return '—';
 if(Array.isArray(v))return v.length?v.map(x=>proposalValueText(x,w)).join('، '):'—';
 if(typeof v==='object')return Object.entries(v).filter(([k,x])=>x!==undefined&&x!==null&&x!==''&&(typeof x!=='object'||Object.keys(x).length)).map(([k,x])=>`${k}: ${proposalValueText(x,w)}`).join(' | ')||'—';
 return String(v);
}
function renderRequestProposalPanel(wid){
 const root=document.getElementById('requestProposalPanel');const w=db.wards.find(x=>String(x.id)===String(wid));if(!root||!w)return;
 const nurses=w.nurses||[];let selectedNurse=ui.proposalNurseId||'';
 if(selectedNurse&&!nurses.some(n=>String(n.id)===String(selectedNurse)))selectedNurse='';
 if(!selectedNurse){const withP=nurses.find(n=>Object.keys(n.requestProposals||{}).length);selectedNurse=withP?String(withP.id):String(nurses[0]?.id||'');ui.proposalNurseId=selectedNurse;}
 const n=nurses.find(x=>String(x.id)===String(selectedNurse));const props=ensureProposalStore(n||{});const keys=proposalKeys(props);let k=ui.proposalMonthKey&&props[ui.proposalMonthKey]?ui.proposalMonthKey:(keys[0]||`${Number((db.hospital?.year||'1405').toString().match(/\d+/)?.[0]||1405)}-1`);ui.proposalMonthKey=k;
 const pr=props[k];
 const sectionNames={daily:'درخواست‌های روزانه'};
 const sectionKeys=Object.keys(sectionNames);
 function status(sec){return pr?.approved?.[sec]?'تأیید شده':'در انتظار بررسی';}
 function allArrays(obj){const out=[];function walk(x,path){if(Array.isArray(x)){if(x.length)out.push([path,x]);return;}if(x&&typeof x==='object'){Object.entries(x).forEach(([a,b])=>walk(b,path?path+'.'+a:a));}}walk(obj,'');return out;}
 function sectionBody(sec){
   if(!pr?.data)return '<div class="notice">برای این ماه پیشنهادی ثبت نشده است.</div>';
   const d=pr.data,c=normalizeProposalMonth(d.monthlyConstraints?.[k]||{});
   if(sec==='daily'){
     const p=d.preferences?.[k]||{},sp=d.softPreferences?.[k]||{};const days=[...new Set([...Object.keys(p),...Object.keys(sp)])].sort((a,b)=>Number(a)-Number(b));
     return days.length?'<div class="tablewrap"><table><tr><th>روز</th><th>درخواست قطعی</th><th>ترجیح</th></tr>'+days.map(day=>`<tr><td>${fa(day)}</td><td>${esc(p[day]||'—')}</td><td>${esc(sp[day]||'—')}</td></tr>`).join('')+'</table></div>':'<div class="hint">درخواست روزانه‌ای ثبت نشده است.</div>';
   }
   if(sec==='come'||sec==='notCome'){
     const o=c[sec]||{};let html='';
     html+='<div class="notice"><b>بازه‌های ماه:</b> '+((o.monthRanges||[]).map(r=>`روز ${fa(r.start)} تا ${fa(r.end)}${r.shifts?.length?' — '+r.shifts.map(x=>SHIFT_LABEL[x]||x).join(' / '):''}`).join('، ')||'ندارد')+'</div>';
     const ms=o.monthSpecific||{};const md=[...new Set([...Object.keys(ms),...Object.keys(o.monthSpecificActive||{})])].sort((a,b)=>Number(a)-Number(b));html+='<div class="notice"><b>روزهای خاص ماه:</b> '+(md.map(x=>`روز ${fa(x)}: ${(ms[x]||[]).map(z=>SHIFT_LABEL[z]||z).join(' / ')||'فعال بدون شیفت مشخص'}`).join('، ')||'ندارد')+'</div>';
     const ws=o.weekSpecific||{};html+='<div class="notice"><b>روزهای خاص هفته:</b> '+(Object.keys(ws).filter(x=>(ws[x]||[]).length).map(x=>`${x}: ${(ws[x]||[]).map(z=>SHIFT_LABEL[z]||z).join(' / ')}`).join('، ')||'ندارد')+'</div>';
     html+='<div class="notice"><b>بازه‌های هفته:</b> '+((o.weekRanges||[]).map(r=>`${r.start} تا ${r.end}${r.shifts?.length?' — '+r.shifts.map(z=>SHIFT_LABEL[z]||z).join(' / '):''}${r.shiftsByDay&&Object.keys(r.shiftsByDay).length?' — جزئیات شیفت هر روز ثبت شده':''}`).join('، ')||'ندارد')+'</div>';
     if(sec==='notCome')html+='<div class="notice"><b>مرخصی‌های درخواستی:</b> '+((o.leaveDays||[]).map(fa).join('، ')||'ندارد')+'</div>';
     return html;
   }
   if(sec==='shift'){
     let html=`<div class="notice"><b>فقط:</b> ${(c.shiftRules.only||[]).map(x=>SHIFT_LABEL[x]||x).join('، ')||'—'} · <b>بیشتر:</b> ${(c.shiftRules.more||[]).map(x=>SHIFT_LABEL[x]||x).join('، ')||'—'} · <b>ممنوع:</b> ${(c.shiftRules.cannot||[]).map(x=>SHIFT_LABEL[x]||x).join('، ')||'—'} · <b>کمتر:</b> ${(c.shiftRules.less||[]).map(x=>SHIFT_LABEL[x]||x).join('، ')||'—'}</div>`;
     html+=`<div class="tablewrap"><table><tr><th>شیفت</th><th>حداقل</th><th>حداکثر</th><th>حداکثر توالی</th></tr>${['morning','evening','night','morning+evening','morning+night'].map(t=>{const mm=c.shiftRules.minMax?.[t]||{};return `<tr><td>${SHIFT_LABEL[t]||t}</td><td>${fa(mm.min||0)}</td><td>${fa(mm.max||0)}</td><td>${fa(c.shiftRules.consecutive?.[t]||0)}</td></tr>`}).join('')}</table></div>`;
     html+=`<div class="notice"><b>محدودیت بعد از شیفت:</b> ${allArrays(c.after).map(([path,a])=>path+': '+a.map(x=>SHIFT_LABEL[x]||x).join('، ')).join(' | ')||'ندارد'}</div>`;
     html+=`<div class="notice"><b>ترجیحات شیفت:</b> ${proposalValueText(c.shiftPreference,w)} · <b>چندشیفته:</b> ${proposalValueText(c.multiShift,w)} · <b>الگوهای روز هفته:</b> ${proposalValueText(c.weekdays,w)} · <b>تعطیلی هفتگی:</b> ${proposalValueText(c.weekdayOff,w)}</div>`;

function workHoursFor(type,holiday,s){
 s=s||DEF;
 if(type==='morning')return holiday?num(s.holidayUpliftHours):num(s.morningHours);
 if(type==='evening')return holiday?num(s.holidayUpliftHours):num(s.eveningHours);
 if(type==='night')return holiday?num(s.nightHolidayHours):num(s.nightHours);
 return 0;
}
function isHoliday(md,y,m,d){
 if(md.holidays&&md.holidays.includes(d))return true;
 // روز جمعه از برنامه اصلی نیز تعطیل محسوب می‌شود؛ تقویم هفته با محاسبه میلادی/ژولیَن ساده نگه داشته می‌شود.
 return jalaliWeekday(y,m,d)==='جمعه';
}
function jalaliWeekday(jy,jm,jd){
 // تبدیل جلالی به روز هفته با الگوریتم معتبر تقویمی
 let y=jy-979,m=jm-1,d=jd-1;
 let jdn=365*y+Math.floor(y/33)*8+Math.floor(((y%33)+3)/4);
 for(let i=0;i<m;i++)jdn+=i<6?31:30;
 jdn+=d;
 return ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'][(jdn+3)%7];
}
function countShift(w,nid,k){
 const md=w.scheduleState?.months?.[k];if(!md)return {morning:0,evening:0,night:0,holiday:0,head:0};
 const [y,m]=k.split('-').map(Number),len=monthLen(y,m),c={morning:0,evening:0,night:0,holiday:0,head:0};
 for(let d=1;d<=len;d++){
   const hol=isHoliday(md,y,m,d),s=md.schedule[d]||{};
   SHIFTS.forEach(t=>{if((s[t]||[]).map(String).includes(String(nid))){c[t]++;if(hol)c.holiday++}});
   if(String(s.headNurse??'')===String(nid))c.head++;
 }
 return c;
}
function leaveDays(w,nid,k){
 const md=w.scheduleState?.months?.[k];if(!md)return 0;
 const [y,m]=k.split('-').map(Number),len=monthLen(y,m);let n=0;
 for(let d=1;d<=len;d++)if((md.leave?.[d]||[]).map(String).includes(String(nid)))n++;
 return n;
}
function calcPerson(w,n,k){
 const s=w.scheduleState;if(!s||!k)return {counts:{morning:0,evening:0,night:0,holiday:0,head:0},work:0,leave:0,total:0,target:0,diff:0};
 const md=s.months[k]||{},[y,m]=k.split('-').map(Number),len=monthLen(y,m),c=countShift(w,n.id,k);
 let work=0;
 for(let d=1;d<=len;d++){
   const hol=isHoliday(md,y,m,d),day=md.schedule[d]||{};
   SHIFTS.forEach(t=>{if((day[t]||[]).map(String).includes(String(n.id)))work+=workHoursFor(t,hol,s.settings)});
   if(String(day.headNurse??'')===String(n.id))work+=num(s.settings.morningHours);
 }
 const leave=leaveDays(w,n.id,k)*num(s.settings.leaveHours);
 const mm=w.monthly?.[k]||{};
 const target=mm.quota?.[n.id]!==undefined?num(mm.quota[n.id]):(mm.defaultQuota!==undefined?num(mm.defaultQuota):num(md.quotaOverrides?.[n.id]??md.quotaDefault));
 return {counts:c,work,leave,total:work+leave,target,diff:work+leave-target};
}
function constraintSummary(n){
 const c=n.monthlyConstraints||{},sr=c.shiftRules||{};
 const cannot=Array.isArray(sr.cannot)?sr.cannot:[];
 const minMax=sr.minMax||{};
 const consecutive=sr.consecutive||{};
 return {cannot,minMax,consecutive,overtimeRequestHours:num(c.overtimeRequestHours||c.hours?.overtimeRequestHours),raw:c};
}

function shiftCapacity(w,t){
 const c=w.capacity||{};
 const map={
  morning:{min:num(c.minMorning),max:num(c.maxMorning)},
  evening:{min:num(c.minEvening),max:num(c.maxEvening)},
  night:{min:num(c.minNight),max:num(c.maxNight)}
 };
 return map[t]||{min:0,max:0};
}
function coverageAudit(w,k){
 const out=[],s=w.scheduleState;
 if(!s||!s.months||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 for(let d=1;d<=len;d++){
  const day=md.schedule?.[d]||{};
  SHIFTS.forEach(t=>{
   const cap=shiftCapacity(w,t),count=(day[t]||[]).length;
   if(cap.min>0&&count<cap.min)
    out.push({level:'critical',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} فقط ${fa(count)} نفر دارد؛ حداقل مجاز ${fa(cap.min)} نفر است.`});
   if(cap.max>0&&count>cap.max)
    out.push({level:'warning',kind:'coverage',day:d,shift:t,count,min:cap.min,max:cap.max,
      text:`روز ${fa(d)}: شیفت ${SHIFT_LABEL[t]} دارای ${fa(count)} نفر است؛ حداکثر مجاز ${fa(cap.max)} نفر است.`});
  });
 }
 return out;
}

function advancedAudit(w,k){
 const out=[],s=w.scheduleState;if(!s||!s.months[k])return out;
 const md=s.months[k],[y,m]=k.split('-').map(Number),len=monthLen(y,m);
 // تعارض‌های آشکار روزانه
 for(let d=1;d<=len;d++){
   const seen={};const day=md.schedule[d]||{};
   SHIFTS.forEach(t=>(day[t]||[]).forEach(id=>{
     const z=String(id);seen[z]=(seen[z]||[]).concat(t);
   }));
   Object.entries(seen).forEach(([id,a])=>{
     if(a.length>2)out.push({level:'critical',text:`روز ${fa(d)}: ${nameOf(w,id)} بیش از دو شیفت دارد.`});
     if(a.includes('evening')&&a.includes('night'))out.push({level:'warning',text:`روز ${fa(d)}: ${nameOf(w,id)} همزمان عصر و شب ثبت شده است.`});
   });
 }
 // محدودیت‌های فردی موجود در فایل اصلی
 w.nurses.forEach(n=>{
   const c=constraintSummary(n),sr=c.raw.shiftRules||{};
   SHIFTS.forEach(t=>{
     const arr=sr.cannot||[];
     if(arr.includes(t)){
       for(let d=1;d<=len;d++)if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id)))
         out.push({level:'critical',text:`${n.name}: شیفت ${SHIFT_LABEL[t]} در محدودیت فردی ممنوع شده ولی ثبت شده است.`});
     }
     const mm=sr.minMax?.[t]||{},cnt=countShift(w,n.id,k)[t];
     if(num(mm.max)>0&&cnt>num(mm.max))out.push({level:'warning',text:`${n.name}: تعداد شیفت ${SHIFT_LABEL[t]} از حداکثر ${fa(mm.max)} بیشتر است.`});
     if(num(mm.min)>0&&cnt<num(mm.min))out.push({level:'warning',text:`${n.name}: حداقل ${fa(mm.min)} شیفت ${SHIFT_LABEL[t]} خواسته شده اما ${fa(cnt)} ثبت شده است.`});
     const lim=num(sr.consecutive?.[t]);if(lim>0){
       let run=0;
       for(let d=1;d<=len;d++){
         if((md.schedule[d]?.[t]||[]).map(String).includes(String(n.id))){run++;if(run>lim){out.push({level:'warning',text:`${n.name}: توالی شیفت ${SHIFT_LABEL[t]} از حد ${fa(lim)} بیشتر شده است.`});break}}
         else run=0;
       }
     }
   });
   const cannotDays=c.raw.cannotDays||c.raw.days?.cannot||[];
   if(Array.isArray(cannotDays))cannotDays.forEach(d=>{
     if((md.schedule[d]?.morning||[]).map(String).includes(String(n.id))||(md.schedule[d]?.evening||[]).map(String).includes(String(n.id))||(md.schedule[d]?.night||[]).map(String).includes(String(n.id)))
       out.push({level:'critical',text:`${n.name}: در روز ${fa(d)} محدودیت عدم حضور ثبت شده ولی شیفت دارد.`});
   });
 });
 return out.slice(0,100);
}

function wardKpi(w,k){
 const nurses=w.nurses||[];
 let work=0,leave=0,total=0,overtime=0,shortage=0;
 nurses.forEach(n=>{
  const c=calcPerson(w,n,k);
  work+=c.work;leave+=c.leave;total+=c.total;
  if(c.diff>0)overtime+=c.diff; else shortage+=Math.abs(c.diff);
 });
 const audits=advancedAudit(w,k);
 const coverage=coverageAudit(w,k);
 const critical=audits.filter(x=>x.level==='critical').length;
 const warning=audits.filter(x=>x.level==='warning').length;
 const coverageCritical=coverage.filter(x=>x.level==='critical').length;
 const coverageWarning=coverage.filter(x=>x.level==='warning').length;
 const md=w.scheduleState?.months?.[k]||{};
 let shifts=0;
 Object.values(md.schedule||{}).forEach(d=>SHIFTS.forEach(t=>shifts+=(d[t]||[]).length));
 const cap=w.capacity||{};
 const days=Math.max(1,monthLen(...k.split('-').map(Number)));
 const minNeed=(cap.minMorning||0)*days+(cap.minEvening||0)*days+(cap.minNight||0)*days;
 const maxAllowed=(cap.maxMorning||0)*days+(cap.maxEvening||0)*days+(cap.maxNight||0)*days;
 const coveragePct=minNeed?Math.min(100,Math.round(shifts/minNeed*100)):null;
 return {nurses:nurses.length,work,leave,total,overtime,shortage,critical,warning,coverageCritical,coverageWarning,shifts,coveragePct,minNeed,maxAllowed};
}

 }).join('');

   {nurses:0,shifts:0,work:0,leave:0,overtime:0,shortage:0,critical:0,warning:0});

function allPersonnel(){
 const map=new Map();
 (db.wards||[]).forEach(w=>(w.nurses||[]).forEach(n=>{
  const gid=String(n.globalPersonnelId||'').trim();
  const key=gid?`g:${gid}`:`n:${norm(n.name||'')}`;
  if(!map.has(key))map.set(key,{key,id:gid,name:n.name||'—',wards:[],refs:[]});
  const p=map.get(key);
  if(!p.wards.includes(w.name))p.wards.push(w.name);
  p.refs.push({w,n});
 }));
 return [...map.values()];
}

function metroEngine(){
 const results=[];
 db.wards.forEach(w=>monthKeys(w).forEach(k=>{
  const md=w.scheduleState?.months?.[k]; if(!md)return;
  const cap=w.capacity||{}, [y,m]=k.split('-').map(Number),len=monthLen(y,m);
  SHIFTS.forEach(sh=>{
   const key=sh==='morning'?'minMorning':sh==='evening'?'minEvening':'minNight';
   const min=Number(cap[key]||0); if(!min)return;
   let shortage=0,days=[];
   for(let d=1;d<=len;d++){const c=(md.schedule?.[d]?.[sh]||[]).length;if(c<min){shortage+=min-c;days.push(`${d}`)}}
   if(shortage)results.push({ward:w.name,month:k,shift:SHIFT_LABEL[sh],shortage,days:days.join('، ')});
  });
 }));
 const suggestions=results.map(r=>{
  const candidates=[];
  db.wards.filter(w=>w.name!==r.ward).forEach(w=>{
   (w.nurses||[]).filter(n=>n.active!==false).forEach(n=>candidates.push(`${n.name} (${w.name})`));
  });
  return `<tr><td>${esc(r.ward)}</td><td>${monthTitle(r.month)}</td><td>${r.shift}</td><td>${fa(r.shortage)}</td><td>${esc(r.days)}</td><td>${candidates.slice(0,8).map(esc).join('، ')||'نیروی کاندید ثبت نشده'}</td></tr>`;
 }).join('');
 return `<div class="card"><div class="title">🧠 موتور پیشنهاد تأمین نیرو</div>

}

function saveTransfer(){
 const sw=currentWard(),month=document.getElementById('tr_month').value,day=Number(document.getElementById('tr_day').value),nid=document.getElementById('tr_nurse').value,from=document.getElementById('tr_from').value,twid=document.getElementById('tr_ward').value,to=document.getElementById('tr_to').value;
 const tw=db.wards.find(x=>x.id===twid);if(!sw||!tw)return toast('بخش مبدأ یا مقصد پیدا نشد.');
 const smd=sw.scheduleState.months[month],tmd=tw.scheduleState.months[month];if(!smd||!tmd)return toast('ماه انتخاب‌شده در هر دو بخش موجود نیست.');
 smd.schedule[day]=smd.schedule[day]||{};tmd.schedule[day]=tmd.schedule[day]||{};
 const src=smd.schedule[day][from]=Array.isArray(smd.schedule[day][from])?smd.schedule[day][from]:[];
 if(!src.map(String).includes(String(nid)))return toast('این پرستار در شیفت انتخاب‌شده ثبت نشده است.');
 src.splice(src.findIndex(x=>String(x)===String(nid)),1);
 let destNid=nid;
 if(tw.id!==sw.id){
   const nurse=sw.nurses.find(n=>String(n.id)===String(nid));if(!nurse)return toast('پرستار پیدا نشد.');
   let dest=tw.nurses.find(n=>n.globalPersonnelId&&n.globalPersonnelId===nurse.globalPersonnelId);
   if(!dest){dest=tw.nurses.find(n=>norm(n.name)===norm(nurse.name));}
   if(!dest){dest=clone(nurse);dest.id=uid();dest.globalPersonnelId=nurse.globalPersonnelId||'';tw.nurses.push(dest);tw.scheduleState.nurses=tw.nurses;}
   destNid=dest.id;
 }
 tmd.schedule[day][to]=Array.isArray(tmd.schedule[day][to])?tmd.schedule[day][to]:[];
 if(!tmd.schedule[day][to].map(String).includes(String(destNid)))tmd.schedule[day][to].push(destNid);
 if(tmd.schedule[day].headNurse&&String(tmd.schedule[day].headNurse)===String(nid)&&tw.id!==sw.id)tmd.schedule[day].headNurse=destNid;
 logActivity('shift-transfer',{fromWard:sw.name,toWard:tw.name,date:`${month}-${day}`,nurseId:nid,from,to});saveDB();closeModal();render();toast('جابه‌جایی انجام شد؛ ساعات و هشدارها دوباره محاسبه شدند.');
}

function saveStaffMovement(){
 const w=currentWard(),type=document.getElementById('sm_type')?.value,nid=document.getElementById('sm_nurse')?.value,destId=document.getElementById('sm_dest')?.value,shift=document.getElementById('sm_shift')?.value,date=document.getElementById('sm_date')?.value.trim(),note=document.getElementById('sm_note')?.value.trim();
 const tw=db.wards.find(x=>x.id===destId),n=w?.nurses.find(x=>String(x.id)===String(nid));
 if(!w||!tw||!n)return toast('پرستار یا بخش مقصد پیدا نشد.');
 if(tw.id===w.id)return toast('بخش مقصد باید با بخش مبدأ متفاوت باشد.');
 if(!date)return toast('تاریخ یا بازه عملیات را وارد کنید.');
 w.staffMovements=w.staffMovements||[];tw.staffMovements=tw.staffMovements||[];
 if(type==='temporary'){
   // Keep source nurse intact; create/link a destination copy by personnel identity.
   let dest=tw.nurses.find(x=>n.globalPersonnelId&&x.globalPersonnelId===n.globalPersonnelId)||tw.nurses.find(x=>norm(x.name)===norm(n.name));
   if(!dest){dest=clone(n);dest.id=uid();tw.nurses.push(dest);tw.scheduleState=tw.scheduleState||normalizeSchedule({nurses:tw.nurses,settings:DEF,months:{}});tw.scheduleState.nurses=tw.nurses;}
   const rec={id:uid(),type:'temporary',nurseId:n.id,nurseName:n.name,fromWardId:w.id,fromWardName:w.name,toWardId:tw.id,toWardName:tw.name,date,shift,note,status:'مأموریت موقت'};
   w.staffMovements.push(rec);tw.staffMovements.push({...rec,id:uid(),status:'نیروی کمکی دریافت شد'});
   logActivity('temporary-support',{fromWard:w.name,toWard:tw.name,nurse:n.name,date,shift,note});
 }else{
   const moved=clone(n); const sourceIndex=w.nurses.findIndex(x=>String(x.id)===String(nid));
   if(sourceIndex<0)return toast('پرستار پیدا نشد.');
   w.nurses.splice(sourceIndex,1);
   if(w.scheduleState)w.scheduleState.nurses=w.nurses;
   let dest=tw.nurses.find(x=>n.globalPersonnelId&&x.globalPersonnelId===n.globalPersonnelId);
   if(dest){Object.assign(dest,moved,{id:dest.id});}
   else{moved.id=uid();tw.nurses.push(moved);}
   if(tw.scheduleState)tw.scheduleState.nurses=tw.nurses;
   const rec={id:uid(),type:'permanent',nurseId:moved.id,nurseName:moved.name,fromWardId:w.id,fromWardName:w.name,toWardId:tw.id,toWardName:tw.name,date,shift,note,status:'انتقال دائم'};
   w.staffMovements.push(rec);tw.staffMovements.push({...rec,id:uid()});
   logActivity('permanent-transfer',{fromWard:w.name,toWard:tw.name,nurse:n.name,date,note});
 }
 saveDB();closeModal();render();toast(type==='permanent'?'انتقال دائم ثبت شد.':'نیروی کمکی ثبت و به بخش مقصد معرفی شد.');
}

function importNurseRequestFor(id){

   const p=JSON.parse(await file.text()); if(p.__app!=='درخواست و محدودیت پرستار' || !p.data)throw new Error('bad');

   // این فایل از داخل «پرونده همان پرستار» بارگذاری می‌شود؛ بنابراین پرستار انتخاب‌شده مرجع قطعی است.

       (p.requestKey&&x.requestKey&&p.requestKey===x.requestKey) ||

       (pname&&proposalNormalizeName(x.name)===pname)

     if(candidates.length===1)n=candidates[0];
   }
   if(!n){toast('⚠️ پرستار مقصد برای بارگذاری مشخص نیست. ابتدا از پرونده همان پرستار روی «بارگذاری فایل درخواست‌ها» بزنید.');return;}

   const directory=Array.isArray(p.peopleDirectory)?p.peopleDirectory:[];
   const mapPersonId=(rawId)=>{const info=directory.find(x=>Number(x.id)===Number(rawId));if(!info)return Number(rawId);const gid=String(info.globalPersonnelId||'').trim(),nm=proposalNormalizeName(info.name||'');const dest=(gid&&nurses.find(x=>String(x.globalPersonnelId||'').trim()===gid))||(nm&&nurses.find(x=>proposalNormalizeName(x.name||'')===nm));return dest?Number(dest.id):Number(rawId);};
   Object.keys(incoming).forEach(k=>{const c=normalizeProposalMonth(incoming[k]);['noWith'].forEach(key=>{if(Array.isArray(c[key]))c[key]=c[key].map(mapPersonId);});['noWith','preferNoWith','mustWith','preferWith'].forEach(key=>{if(Array.isArray(c.people[key]))c.people[key]=c.people[key].map(mapPersonId);});c.noWith=c.people.noWith.slice();incoming[k]=c;});

   months.forEach(k=>{n.requestProposals[k]={id:uid(),importedAt:new Date().toISOString(),sourceFile:file.name,requestKey:p.requestKey||'',nurse:clone(p.nurse||{}),data:{preferences:{[k]:prefs[k]||{}},softPreferences:{[k]:soft[k]||{}},monthlyConstraints:{[k]:incoming[k]||{}},note:String(p.data.note||'')},approved:{}};});
   saveDB();ui.proposalNurseId=n.id;ui.proposalMonthKey=months[0];openRequestProposalPanel(w.id);toast('فایل وارد شد؛ فقط «درخواست‌های روزانه» در بسته پیشنهادی نمایش داده می‌شود.');

#syncToast{position:fixed;bottom:84px;right:20px;background:#12262c;color:#eaf7f6;font-size:12px;padding:8px 12px;border-radius:10px;z-index:999999;display:none;max-width:220px;box-shadow:0 6px 16px rgba(0,0,0,.3)}

<button id="syncFab" type="button" title="همگام‌سازی با سرور">🔄</button>
<div id="syncToast"></div>
<script>
const syncFab=document.getElementById('syncFab'), syncToastEl=document.getElementById('syncToast');
function showSyncToast(msg){
  syncToastEl.textContent=msg; syncToastEl.style.display='block';
  clearTimeout(showSyncToast._t);
  showSyncToast._t=setTimeout(()=>{syncToastEl.style.display='none';},3500);
}
syncFab.onclick=async function(){
  if(syncFab.classList.contains('spinning')) return;
  syncFab.classList.add('spinning');
  showSyncToast('در حال دریافت آخرین اطلاعات از سرور...');
  try{
    const cloudData = await loadDBFromCloud();
    if(cloudData && Array.isArray(cloudData.wards)){
      db = cloudData;
      localStorage.setItem(KEY, JSON.stringify(db));
      if(typeof supervisorFrame!=='undefined' && supervisorFrame && supervisorWardId){
        const w=db.wards.find(x=>x.id===supervisorWardId);
        if(w){ try{ supervisorFrame.contentWindow.postMessage({bridge:'__METRON_SUPERVISOR_BRIDGE__',type:'INIT',state:w.scheduleState||{}},'*'); }catch(e){} }
      }
      render();
      showSyncToast('✅ اطلاعات با سرور همگام شد.');
    } else {
      showSyncToast('⚠️ اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.');
    }
  }catch(e){
    console.error('Sync error:',e);
    showSyncToast('⚠️ خطا در همگام‌سازی.');
  }
  syncFab.classList.remove('spinning');
};
</script>
